<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>House Trading Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    color-scheme: dark;
    --bg: #0d131a;
    --card: #151d27;
    --raised: #1b2532;
    --ink: #e7eef6;
    --soft: #b9c6d4;
    --muted: #8193a8;
    --line: #253142;
    --blue: #2ea8f5;
    --pink: #ea4c82;
    --green: #41b04b;
    --purple: #9d52e3;
    --amber: #f0a23a;
    --red: #f06a6a;
    --money: #5ed68e;
    --tile: #1d2835;
    --tile-neon: #17322a;
    --tile-mega: #2a2140;
    --radius: 16px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
    margin: 0;
    font-family: "Fredoka", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
}
button, input { font: inherit; color: inherit; }
.logo {
    width: 52px; height: 52px; border-radius: 15px; flex: none;
    background: linear-gradient(145deg, #2ea8f5, #1a7fd0);
    display: grid; place-items: center; box-shadow: 0 6px 18px rgba(46,168,245,.3);
}

/* ── login ────────────────────────────────────────────── */
.gate {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background:
        radial-gradient(900px 420px at 20% -10%, rgba(46,168,245,.28), transparent 70%),
        linear-gradient(170deg, #13283d 0%, #0f1c2a 45%, var(--bg) 100%);
}
.gate form {
    width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 30px 28px 26px; box-shadow: 0 18px 50px rgba(0,0,0,.45);
    display: flex; flex-direction: column; align-items: center; text-align: center;
}
.gate h1 { margin: 16px 0 4px; font-size: 26px; font-weight: 700; }
.gate p { margin: 0 0 22px; font-size: 15px; color: var(--soft); }
.gate .field {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 0 14px; min-height: 56px;
    background: var(--raised); border: 1px solid var(--line); border-radius: 14px;
}
.gate .field:focus-within { border-color: var(--blue); }
.gate input { border: 0; background: transparent; outline: 0; font-size: 18px; width: 100%; letter-spacing: .5px; }
.gate input::placeholder { color: var(--muted); letter-spacing: 0; }
.gate button {
    width: 100%; margin-top: 12px; height: 54px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--blue); color: #fff; font-size: 18px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(46,168,245,.3); transition: filter .12s, opacity .12s;
}
.gate button:hover { filter: brightness(1.08); }
.gate button:disabled { opacity: .55; cursor: default; filter: none; }
.gate .msg { min-height: 22px; margin-top: 14px; font-size: 14.5px; color: var(--muted); }
.gate .msg.bad { color: var(--red); }

/* ── top band ─────────────────────────────────────────── */
.hero {
    background:
        radial-gradient(900px 300px at 15% -40%, rgba(46,168,245,.35), transparent 70%),
        linear-gradient(160deg, #13283d 0%, #0f1c2a 60%, var(--bg) 100%);
    padding: 28px 24px 72px;
    border-bottom: 1px solid #16222f;
}
.hero-inner {
    max-width: 1280px; margin: 0 auto;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 14px; }
h1 { margin: 0; font-size: 32px; font-weight: 700; }
.sub { margin: 4px 0 0; font-size: 15px; color: var(--soft); }
.sub.bad { color: var(--amber); }
.right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat {
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
    border-radius: 14px; padding: 9px 16px; min-width: 92px;
}
.stat b { display: block; font-size: 22px; font-weight: 600; line-height: 1.2; }
.stat b.money { color: var(--money); }
.stat span { font-size: 12.5px; color: var(--muted); }
.lock {
    align-self: stretch; display: flex; align-items: center; gap: 8px; padding: 0 16px; cursor: pointer;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 14px;
    font-size: 15px; font-weight: 500; color: var(--soft);
}
.lock:hover { color: var(--ink); border-color: rgba(255,255,255,.2); }

/* ── controls: group switch + account search ──────────── */
.wrap { max-width: 1280px; margin: -48px auto 48px; padding: 0 20px; }
.toolbar {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    padding: 12px; position: sticky; top: 10px; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 12px;
}
.groups {
    flex: 3 1 440px; display: flex; gap: 6px; padding: 5px;
    background: var(--raised); border: 1px solid var(--line); border-radius: 14px;
}
.groups button {
    flex: 1 1 0; min-width: 0; height: 52px; border: 0; border-radius: 10px; background: transparent;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 20px; font-weight: 600; color: var(--soft); text-transform: capitalize;
    cursor: pointer; transition: background .12s, color .12s;
}
.groups button:hover { background: rgba(255,255,255,.05); color: var(--ink); }
.groups button.on { background: var(--blue); color: #fff; box-shadow: 0 4px 14px rgba(46,168,245,.35); }
.groups .n {
    font-size: 14px; font-weight: 600; line-height: 22px; padding: 0 9px; border-radius: 999px;
    background: rgba(255,255,255,.08); color: var(--muted);
}
.groups button.on .n { background: rgba(255,255,255,.24); color: #fff; }
.search {
    flex: 2 1 260px; display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 0 16px;
    background: var(--raised); border: 1px solid var(--line); border-radius: 14px;
}
.search:focus-within { border-color: var(--blue); }
.search input { border: 0; background: transparent; outline: 0; font-size: 17px; width: 100%; }
.search input::placeholder { color: var(--muted); }

/* ── account cards ────────────────────────────────────── */
.acct {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    margin-top: 16px; padding: 16px 18px 18px;
}
.acct-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.avatar {
    width: 60px; height: 60px; border-radius: 16px; flex: none; object-fit: cover;
    background: linear-gradient(#243244, #1b2735);
}
.avatar.fallback { display: grid; place-items: center; font-size: 26px; font-weight: 600; color: var(--muted); }
.who { min-width: 0; }
.who h2 { margin: 0; font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.uid { font-size: 13px; font-weight: 400; color: var(--muted); }
.group {
    font-size: 12px; font-weight: 500; letter-spacing: .3px; text-transform: capitalize;
    padding: 1px 9px; border-radius: 999px; background: rgba(46,168,245,.14); color: #7cc8fa;
}
.meta { font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; margin-top: 3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #4a5a6e; flex: none; }
.dot.live { background: #35c26b; box-shadow: 0 0 0 3px rgba(53,194,107,.18); }
.dot.recent { background: var(--amber); }
.meta time { color: var(--ink); font-weight: 500; }
.acct-stats { margin-left: auto; display: flex; gap: 22px; }
.acct-stats div { text-align: right; }
.acct-stats b { display: block; font-size: 18px; font-weight: 600; }
.acct-stats b.money { color: var(--money); }
.acct-stats b.out, .stat b.out { color: var(--red); }
.acct-stats b.unknown { color: var(--muted); }
.acct-stats span { font-size: 12.5px; color: var(--muted); }

/* ── item tiles (modelled on the in-game backpack) ────── */
.grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 14px 12px; margin-top: 16px;
}
.item { min-width: 0; }
.tile {
    position: relative; aspect-ratio: 1; border-radius: 14px; background: var(--tile);
    display: grid; place-items: center; overflow: hidden;
    border-bottom: 3px solid transparent; transition: transform .12s, box-shadow .12s, border-color .12s;
}
.tile.neon { background: var(--tile-neon); }
.tile.mega { background: var(--tile-mega); }
.tile.mega::before {                 /* mega neons glow rainbow in game; a faint rim says so here */
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px;
    background: conic-gradient(#ff7eb3, #ffd36e, #7ee08a, #6ec8ff, #b28bff, #ff7eb3);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; opacity: .75;
}
.item:hover .tile { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.4); border-bottom-color: var(--blue); }
.tile img { width: 80%; height: 80%; object-fit: contain; filter: drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
.tile.missing::after { content: "no image"; font-size: 11px; color: var(--muted); }
.badges { position: absolute; right: 4px; bottom: 4px; display: flex; gap: 1px; }
.b {
    width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
    color: #fff; font-size: 12px; font-weight: 700; font-style: normal;
    border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
.b.n { background: var(--green); }
.b.m { background: var(--purple); }
.b.f { background: var(--blue); }
.b.r { background: var(--pink); }
.count {
    position: absolute; left: 5px; top: 5px; border-radius: 999px; padding: 0 7px;
    background: rgba(0,0,0,.6); color: #fff; font-size: 11.5px; font-weight: 600; line-height: 19px;
}
.name {
    margin-top: 6px; font-size: 12.5px; text-align: center; color: var(--soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.price { font-size: 12.5px; text-align: center; font-weight: 600; color: var(--money); line-height: 1.3; }
.more {
    margin-top: 14px; border: 1px solid var(--line); background: var(--raised); border-radius: 10px;
    padding: 7px 14px; font-size: 14px; cursor: pointer; color: #7cc8fa; font-weight: 500;
}
.more:hover { border-color: #3a4a60; }
.nothing { margin-top: 14px; font-size: 14px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 48px 0; }

/* ── page switch in the top band ──────────────────────── */
.nav {
    align-self: stretch; display: flex; gap: 4px; padding: 4px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 14px;
}
.nav button {
    border: 0; background: transparent; border-radius: 10px; padding: 0 16px; min-height: 40px; cursor: pointer;
    font-size: 15px; font-weight: 600; color: var(--soft);
}
.nav button:hover { color: var(--ink); }
.nav button.on { background: var(--blue); color: #fff; }

/* ── settings ─────────────────────────────────────────── */
select { font: inherit; color: inherit; }
textarea { font: inherit; color: inherit; }
#setTabs { align-self: center; flex-basis: 420px; }
.savebar { flex: 2 1 340px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.s-state { margin-right: auto; font-size: 14.5px; color: var(--muted); }
.s-state.dirty { color: var(--amber); font-weight: 500; }
.btn {
    height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised);
    font-size: 14.5px; font-weight: 500; white-space: nowrap; cursor: pointer;
}
.btn:hover { border-color: #3a4a60; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
.btn.danger { color: var(--red); }
.btn.small { height: 32px; padding: 0 10px; font-size: 13.5px; }
.btn:disabled { opacity: .45; cursor: default; }
.in, .ta {
    background: var(--raised); border: 1px solid var(--line); border-radius: 10px; outline: 0;
    font-size: 14.5px; min-width: 0;
}
.in { height: 36px; padding: 0 10px; width: 100%; }
select.in { padding: 0 6px; }
.in:focus, .ta:focus { border-color: var(--blue); }
.ta { display: block; width: 100%; padding: 9px 12px; line-height: 1.5; resize: vertical; font-size: 14px; }
.ta::placeholder, .in::placeholder { color: #5f7186; }
.s-num { width: 100px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 16px; padding: 16px 18px 18px; }
.card h2 { margin: 0; font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card h3 { margin: 0; font-size: 16px; font-weight: 600; }
.s-tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.s-pill { font-size: 12.5px; font-weight: 500; padding: 1px 9px; border-radius: 999px; background: rgba(46,168,245,.14); color: #7cc8fa; }
.s-pill.warn { background: rgba(240,162,58,.14); color: var(--amber); }
.s-hint { font-size: 13.5px; color: var(--muted); margin: 6px 0 0; line-height: 1.45; }
.s-hint code, .s-msg code { background: var(--raised); padding: 0 5px; border-radius: 5px; color: var(--soft); }
.s-warn { color: var(--amber); }
.s-bad { color: var(--red); }
.s-msg {
    margin-top: 16px; padding: 12px 16px; border-radius: 12px; font-size: 14.5px; line-height: 1.45;
    background: rgba(46,168,245,.1); border: 1px solid rgba(46,168,245,.35);
}
.s-msg.ok { background: rgba(94,214,142,.08); border-color: rgba(94,214,142,.35); }
.s-msg.bad { background: rgba(240,106,106,.08); border-color: rgba(240,106,106,.4); }
.s-msg .btn { margin: 6px 6px 0 0; }
.s-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.s-row .search { flex: 1 1 260px; min-height: 48px; }
.s-scroll { overflow-x: auto; margin-top: 10px; }
.s-tbl { width: 100%; border-collapse: collapse; min-width: 640px; }
.s-tbl th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--muted); padding: 0 6px 6px; }
.s-tbl td { padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.s-tbl .s-ck { width: 30px; text-align: center; padding-top: 13px; }
.s-tbl input[type=checkbox], .s-check input { width: 17px; height: 17px; accent-color: var(--blue); cursor: pointer; }
.s-tbl .s-end { text-align: right; white-space: nowrap; }
.s-link { border: 0; background: none; padding: 7px 0 0; cursor: pointer; font-size: 15px; font-weight: 500; text-align: left; }
.s-link:hover { color: #7cc8fa; text-decoration: underline; }
.s-note { font-size: 12.5px; margin-top: 3px; }
.s-extra td { border-top: 0; padding-top: 0; }
.s-ov { display: flex; gap: 14px; flex-wrap: wrap; padding: 4px 0 8px; }
.s-ov label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
.s-ov .s-num { width: 170px; }
.s-add { display: flex; gap: 8px; margin-top: 12px; }
.s-bulk {
    position: sticky; bottom: 12px; z-index: 4; display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); border-color: var(--blue);
}
.s-bulk > b { align-self: center; margin-right: 6px; }
.s-bulk label { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); }
.s-bulk .in { width: 150px; }
.s-bulk .s-pair { display: flex; gap: 4px; align-items: flex-end; }
.s-cols { display: grid; grid-template-columns: 250px 1fr; gap: 16px; align-items: start; }
.s-sets { position: sticky; top: 104px; }
.s-setbtn {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px;
    padding: 9px 12px; border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left;
}
.s-setbtn b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-setbtn span { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.s-setbtn:hover { background: rgba(255,255,255,.04); }
.s-setbtn.on { background: rgba(46,168,245,.14); border-color: rgba(46,168,245,.45); }
.s-cat { margin-top: 6px; border: 1px solid var(--line); border-radius: 12px; }
.s-cat[open] { border-color: #34465c; }
.s-cat > summary {
    list-style: none; display: flex; align-items: center; gap: 10px; margin: 0; padding: 10px 14px;
    color: var(--ink); font-size: 15px; font-weight: 500;
}
.s-cat > summary::-webkit-details-marker { display: none; }
.s-cat > summary::before { content: "\25B8"; color: var(--muted); transition: transform .12s; }
.s-cat[open] > summary::before { transform: rotate(90deg); }
.s-cat > summary:hover { color: #7cc8fa; }
.s-cat .s-count { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--muted); white-space: nowrap; }
.s-cat .s-count.s-bad { color: var(--red); }
.s-cat-body { padding: 0 14px 14px; }
.s-cat-body .btn { margin-top: 8px; }
.s-sep { margin: 20px 0 2px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.s-pill[title] { cursor: help; }
.s-field { display: grid; grid-template-columns: 220px 1fr; gap: 6px 16px; align-items: center; margin-top: 12px; }
.s-field > span { font-weight: 500; }
.s-field .s-hint { grid-column: 2; margin: 0; }
.s-modal {
    position: fixed; inset: 0; z-index: 20; background: rgba(5,9,14,.72);
    display: grid; place-items: center; padding: 20px; overflow-y: auto;
}
.s-dialog {
    width: 100%; max-width: 640px; background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 22px 24px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
}
.s-dialog h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
.s-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.s-files { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.s-file { padding: 9px 12px; background: var(--raised); border-radius: 10px; font-size: 14px; }
.s-check { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; cursor: pointer; font-size: 14.5px; }
.s-check small { display: block; color: var(--muted); font-size: 13px; }
.s-list { margin: 8px 0 0; padding-left: 20px; font-size: 14px; line-height: 1.6; }
.s-hist { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
.s-hist td { padding: 7px 6px; border-top: 1px solid var(--line); }
.s-drop { margin-top: 14px; display: block; padding: 18px; border: 2px dashed var(--line); border-radius: 14px; text-align: center; cursor: pointer; color: var(--soft); }
.s-drop:hover { border-color: var(--blue); }
.s-drop input { display: none; }
details summary { cursor: pointer; color: #7cc8fa; font-size: 14px; margin-top: 12px; }

@media (max-width: 860px) {
    .s-cols { grid-template-columns: 1fr; }
    .s-sets { position: static; }
    .s-field { grid-template-columns: 1fr; }
    .s-field .s-hint { grid-column: 1; }
}

@media (max-width: 640px) {
    .toolbar { position: static; }   /* two full-width rows would cover half a phone screen */
    .groups button { height: 46px; font-size: 17px; }
    .search { min-height: 56px; }
    .acct-stats { margin-left: 0; width: 100%; justify-content: flex-start; }
    .acct-stats div { text-align: left; }
}
</style>
</head>
<body>

<!-- The page itself holds no account data. Everything below the login comes from the Worker,
     and the Worker only answers when it is sent the right password. -->
<section class="gate" id="gate">
    <form id="login" autocomplete="off">
        <div class="logo">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
        </div>
        <h1>House Trading Dashboard</h1>
        <p>Enter the password to continue</p>
        <label class="field">
            <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
        </label>
        <button id="go" type="submit">Unlock</button>
        <div class="msg" id="msg" role="alert"></div>
    </form>
</section>

<div id="app" hidden>
    <header class="hero">
        <div class="hero-inner">
            <div class="brand">
                <div class="logo">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/>
                    </svg>
                </div>
                <div>
                    <h1>House Trading Dashboard</h1>
                    <p class="sub" id="status"></p>
                </div>
            </div>
            <div class="right">
                <div class="stats" id="stats"></div>
                <div class="nav" id="nav">
                    <button type="button" class="on" data-view="inv">Inventory</button>
                    <button type="button" data-view="set">Settings</button>
                </div>
                <button class="lock" id="lockBtn" type="button" title="Hide everything and ask for the password again">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                    Lock
                </button>
            </div>
        </div>
    </header>

    <div class="wrap" id="invView">
        <section class="toolbar">
            <div class="groups" id="groups" role="group" aria-label="Group"></div>
            <label class="search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8193a8" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="q" type="search" placeholder="Search accounts" autocomplete="off" spellcheck="false">
            </label>
        </section>

        <main id="accounts"></main>
    </div>

    <!-- Settings: what each PC's settings.lua used to hold. script.lua loads it from the Worker. -->
    <div class="wrap" id="setView" hidden>
        <section class="toolbar">
            <div class="groups" id="setTabs" role="group" aria-label="Settings section"></div>
            <div class="savebar">
                <span class="s-state" id="setState"></span>
                <button class="btn" type="button" data-act="import" title="Load settings.lua files from your PCs">Import</button>
                <button class="btn" type="button" data-act="history">History</button>
                <button class="btn" type="button" data-act="discard" id="setDiscard">Discard</button>
                <button class="btn primary" type="button" data-act="save" id="setSave">Save</button>
            </div>
        </section>
        <div id="setMsg"></div>
        <main id="setBody"></main>
    </div>

    <div class="s-modal" id="modal" hidden><div class="s-dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
</div>

<script>
// ── the only line to edit ────────────────────────────────────────────────────
// Your Cloudflare Worker's address, exactly as the Worker page shows it, e.g.
//   const API_URL = "https://house-trading.yourname.workers.dev";
const API_URL = "https://house-trading.nova-39153a.workers.dev";
// ─────────────────────────────────────────────────────────────────────────────

const API = API_URL.trim().replace(/\/+$/, "");
const HEADSHOT = id => `https://api.newstargeted.com/roblox/users/v1/avatar-headshot?userid=${encodeURIComponent(id)}&size=150x150&format=Png&isCircular=false`;
const ITEM_IMG = kind => `https://cdn.playadopt.me/items/${encodeURIComponent(kind)}.png`;

const SHOW_FIRST = 18;           // tiles per account before "Show all"
const LIVE_MS    = 10 * 60e3;    // green dot: reported within 10 min
const RECENT_MS  = 2 * 3600e3;   // amber dot: within 2 h
const MIN_PRICE  = 0.10;         // USD; cheaper items are never shown or counted
const REFRESH_MS = 60e3;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = n => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const clock = t => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

// The password lives in this variable only: never in storage, a cookie or the address bar,
// so every new visit (or reload) asks for it again.
let password = null;
let session = 0;                 // bumped on lock so late answers from before are thrown away
let refreshTimer = null;
let ACCOUNTS = [], GROUPS = [];
const state = { q: "", group: "all", open: new Set() };

// ── talking to the Worker ────────────────────────────────────────────────────
async function askWorker(pw) {
    let res;
    try {
        res = await fetch(API + "/api/dashboard", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: pw }),
            cache: "no-store",
        });
    } catch {
        return { kind: "offline" };
    }
    let body = null;
    try { body = await res.json(); } catch {}
    if (res.ok && body && Array.isArray(body.accounts)) return { kind: "ok", body };
    if (res.status === 401) return { kind: "wrong", triesLeft: body && body.triesLeft };
    if (res.status === 429) return { kind: "locked", retryAfter: (body && body.retryAfter) || 900 };
    return { kind: "error", detail: (body && body.error) || `HTTP ${res.status}` };
}

const waitWords = s => { const m = Math.ceil(s / 60); return m <= 1 ? "a minute" : `${m} minutes`; };

function showMsg(text, bad) {
    $("msg").textContent = text;
    $("msg").className = bad ? "msg bad" : "msg";
}

$("login").addEventListener("submit", async e => {
    e.preventDefault();
    const pw = $("pw").value;
    if (!pw) return;
    $("go").disabled = true;
    $("go").textContent = "Checking…";
    showMsg("");
    const r = await askWorker(pw);
    $("go").disabled = false;
    $("go").textContent = "Unlock";

    if (r.kind === "ok") return unlock(pw, r.body);
    $("pw").select();
    if (r.kind === "wrong") {
        showMsg(r.triesLeft > 0 ? `Wrong password. ${r.triesLeft} ${r.triesLeft === 1 ? "try" : "tries"} left before a 15 minute lockout.` : "Wrong password.", true);
    } else if (r.kind === "locked") {
        showMsg(`Too many wrong tries. Try again in ${waitWords(r.retryAfter)}.`, true);
    } else if (r.kind === "offline") {
        showMsg("Can't reach the dashboard server. Check your connection and API_URL.", true);
    } else {
        showMsg(`The dashboard server had a problem: ${r.detail}`, true);
    }
});

function unlock(pw, body) {
    password = pw;
    $("pw").value = "";
    showMsg("");
    load(body);
    $("gate").hidden = true;
    $("app").hidden = false;
    clearInterval(refreshTimer);
    refreshTimer = setInterval(refresh, REFRESH_MS);
}

function lock(reason) {
    session++;
    password = null;
    clearInterval(refreshTimer);
    ACCOUNTS = []; GROUPS = [];
    state.open.clear();
    resetSettings();
    for (const id of ["stats", "groups", "accounts", "status"]) $(id).innerHTML = "";
    $("app").hidden = true;
    $("gate").hidden = false;
    showMsg(reason || "", !!reason);
    $("pw").focus();
}

async function refresh() {
    if (!password) return;
    const mine = session;
    const r = await askWorker(password);
    if (mine !== session) return;
    if (r.kind === "ok") return load(r.body);
    if (r.kind === "wrong") return lock("The password was changed. Enter the new one.");
    setStatus(`Couldn't refresh (${r.kind === "offline" ? "no connection" : r.kind === "locked" ? "locked out" : r.detail}). Showing data from ${clock(lastLoad)}.`, true);
}

// ── turning the Worker's answer into cards ───────────────────────────────────
let lastLoad = 0;

// One tile per kind + form + fly/ride, however many copies the account holds; most expensive first.
function stack(items) {
    const byKey = new Map();
    for (const it of items) {
        const price = Number(it.price);
        if (!(price >= MIN_PRICE)) continue;
        const key = `${it.kind}|${it.form}|${it.fly}|${it.ride}`;
        const had = byKey.get(key);
        if (had) had.count += it.count;
        else byKey.set(key, {
            kind: String(it.kind), name: String(it.name || it.kind), category: String(it.category || ""),
            form: it.form === "mega" || it.form === "neon" ? it.form : "normal",
            fly: it.fly === true, ride: it.ride === true, count: Math.max(1, Number(it.count) || 1), price,
        });
    }
    return [...byKey.values()].sort((a, b) => b.price - a.price || a.name.localeCompare(b.name));
}

function load(body) {
    // Clock skew between this device and the Worker would make every "x min ago" wrong, so shift to our clock.
    const skew = Date.now() - (Number(body.now) || Date.now());
    ACCOUNTS = body.accounts.map(a => {
        const items = stack(Array.isArray(a.items) ? a.items : []);
        return {
            username: String(a.username), userId: Number(a.userId) || 0,
            group: String(a.group || "") || "other", updatedAt: (Number(a.updatedAt) || 0) + skew, items,
            pets:  items.filter(it => it.category === "pets").reduce((s, it) => s + it.count, 0),
            total: items.reduce((s, it) => s + it.count, 0),
            value: items.reduce((s, it) => s + it.price * it.count, 0),
            // houses still owned, 1 = only the base house left; null = this PC's script.lua is older
            houses: Number.isInteger(a.houses) ? a.houses : null,
        };
    }).sort((a, b) => b.updatedAt - a.updatedAt);
    GROUPS = [...new Set(ACCOUNTS.map(a => a.group))].sort();
    if (state.group !== "all" && !GROUPS.includes(state.group)) state.group = "all";
    lastLoad = Date.now();
    setStatus(`Loaded ${clock(lastLoad)} · refreshes every minute`);
    render();
}

function setStatus(text, bad) {
    $("status").textContent = text;
    $("status").className = bad ? "sub bad" : "sub";
}

// ── rendering ────────────────────────────────────────────────────────────────
function ago(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 45) return "just now";
    const m = Math.round(s / 60);
    if (m < 60) return `${m} min ago`;
    const h = Math.round(m / 60);
    if (h < 24) return `${h} hour${h === 1 ? "" : "s"} ago`;
    const d = Math.round(h / 24);
    return `${d} day${d === 1 ? "" : "s"} ago`;
}
const exact = t => new Date(t).toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const freshness = age => age < LIVE_MS ? "live" : age < RECENT_MS ? "recent" : "stale";
const inGroup = a => state.group === "all" || a.group === state.group;

function renderStats() {
    const list = ACCOUNTS.filter(inGroup);
    const sum = fn => list.reduce((s, a) => s + fn(a), 0);
    $("stats").innerHTML = [
        [sum(a => a.pets), "pets"],
        [sum(a => a.total), "items"],
        [usd(sum(a => a.value)), "total value", "money"],
        ...(() => {
            const out = list.filter(a => a.houses !== null && a.houses <= 1).length;
            return out ? [[out, `out of houses`, "out"]] : [];
        })(),
    ].map(([v, l, cls]) => `<div class="stat"><b class="${cls || ""}">${v}</b><span>${l}</span></div>`).join("");
}

function renderGroups() {
    const opt = (val, label, n) => {
        const on = state.group === val;
        return `<button type="button" class="${on ? "on" : ""}" data-group="${esc(val)}" aria-pressed="${on}">${label}<span class="n">${n}</span></button>`;
    };
    $("groups").innerHTML = opt("all", "All", ACCOUNTS.length) +
        GROUPS.map(g => opt(g, esc(g), ACCOUNTS.filter(a => a.group === g).length)).join("");
}

function tile(it) {
    const formWord = it.form === "mega" ? "Mega Neon " : it.form === "neon" ? "Neon " : "";
    const abil = [it.fly && "Fly", it.ride && "Ride"].filter(Boolean).join(" + ");
    const money = it.count > 1 ? `${usd(it.price)} each, ${usd(it.price * it.count)} total` : usd(it.price);
    const tip = `${formWord}${it.name}${abil ? ` · ${abil}` : ""}${it.count > 1 ? ` · x${it.count}` : ""} · ${money}`;
    const badges =
        (it.form === "mega" ? `<i class="b m">M</i>` : it.form === "neon" ? `<i class="b n">N</i>` : "") +
        (it.fly ? `<i class="b f">F</i>` : "") + (it.ride ? `<i class="b r">R</i>` : "");
    return `<div class="item" title="${esc(tip)}">
        <div class="tile ${it.form === "normal" ? "" : it.form}">
            <img src="${esc(ITEM_IMG(it.kind))}" alt="${esc(it.name)}" loading="lazy">
            ${it.count > 1 ? `<span class="count">x${it.count}</span>` : ""}
            ${badges ? `<div class="badges">${badges}</div>` : ""}
        </div>
        <div class="name">${esc(it.name)}</div>
        <div class="price">${usd(it.price)}</div>
    </div>`;
}

function houseStat(n) {
    if (n === null) return `<div title="Not reported yet. Update script.lua on this account's PC."><b class="unknown">?</b><span>houses</span></div>`;
    if (n <= 1) return `<div title="Only the base house is left, so the script has stopped trading."><b class="out">${n}</b><span>houses</span></div>`;
    return `<div><b>${n}</b><span>houses</span></div>`;
}

function card(a) {
    const open = state.open.has(a.username);
    const shown = open ? a.items : a.items.slice(0, SHOW_FIRST);
    const age = Date.now() - a.updatedAt;
    return `<article class="acct">
        <header class="acct-head">
            <img class="avatar" src="${esc(HEADSHOT(a.userId))}" alt="" data-initial="${esc(a.username[0] || "?")}">
            <div class="who">
                <h2>${esc(a.username)}<span class="uid">#${a.userId}</span><span class="group">${esc(a.group)}</span></h2>
                <div class="meta">
                    <span class="dot ${freshness(age)}" data-t="${a.updatedAt}"></span>
                    Last updated <time data-t="${a.updatedAt}" title="${esc(exact(a.updatedAt))}">${ago(age)}</time>
                </div>
            </div>
            <div class="acct-stats">
                <div><b>${a.pets}</b><span>pets</span></div>
                <div><b>${a.total}</b><span>items</span></div>
                ${houseStat(a.houses)}
                <div><b class="money">${usd(a.value)}</b><span>value</span></div>
            </div>
        </header>
        ${a.items.length
            ? `<div class="grid">${shown.map(tile).join("")}</div>`
            : `<div class="nothing">Nothing worth ${usd(MIN_PRICE)} or more.</div>`}
        ${a.items.length > SHOW_FIRST
            ? `<button class="more" data-user="${esc(a.username)}">${open ? "Show less" : `Show all ${a.items.length}`}</button>` : ""}
    </article>`;
}

function renderAccounts() {
    if (!ACCOUNTS.length) {
        $("accounts").innerHTML = `<div class="empty">No reports yet. An account shows up here about 10 seconds after script.lua starts on it.</div>`;
        return;
    }
    const q = state.q.trim().toLowerCase();
    const html = ACCOUNTS
        .filter(a => inGroup(a) && (!q || a.username.toLowerCase().includes(q)))
        .map(card).join("");
    $("accounts").innerHTML = html || `<div class="empty">No accounts match.</div>`;
}

function render() { renderStats(); renderGroups(); renderAccounts(); }

// ── wiring ───────────────────────────────────────────────────────────────────
$("lockBtn").addEventListener("click", () => {
    if (settingsDirty() && !confirm("You have settings changes that aren't saved. Lock anyway and lose them?")) return;
    lock();
});
$("q").addEventListener("input", e => { state.q = e.target.value; renderAccounts(); });
document.addEventListener("click", e => {
    if (!password) return;
    const g = e.target.closest("[data-group]");
    if (g) { state.group = g.dataset.group; return render(); }
    const more = e.target.closest(".more");
    if (more) {
        const u = more.dataset.user;
        state.open.has(u) ? state.open.delete(u) : state.open.add(u);
        renderAccounts();
    }
});

// Broken pictures: a letter instead of a headshot, "no image" instead of an item.
document.addEventListener("error", e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement)) return;
    if (img.classList.contains("avatar")) {
        const d = document.createElement("div");
        d.className = "avatar fallback";
        d.textContent = (img.dataset.initial || "?").toUpperCase();
        img.replaceWith(d);
    } else if (img.closest(".tile")) {
        img.closest(".tile").classList.add("missing");
        img.remove();
    }
}, true);

// Keep "x min ago" and the freshness dots honest between refreshes without re-rendering the grid.
setInterval(() => {
    const now = Date.now();
    document.querySelectorAll("time[data-t]").forEach(t => { t.textContent = ago(now - Number(t.dataset.t)); });
    document.querySelectorAll(".dot[data-t]").forEach(d => { d.className = `dot ${freshness(now - Number(d.dataset.t))}`; });
}, 30e3);

if (!/^https?:\/\//.test(API)) {
    $("pw").disabled = $("go").disabled = true;
    showMsg("Not connected yet: put your Worker address in API_URL near the top of the script in index.html.", true);
}
</script>

<script>
// ══ Settings page ═══════════════════════════════════════════════════════════
// Edits what settings.lua used to hold. Nothing goes to the Worker until Save;
// every running script.lua picks up a saved version within 5 minutes.

// Without these the script has nothing to say at that point of a trade, so Default must fill them.
const REQUIRED_CATS = ["trade_open", "good", "value_question", "built_replies", "traded_replies", "inv_access_denied",
    "no_match_found", "portal_replies", "bot_denial_replies", "other_house_replies", "there_replies"];
// Left empty, the script falls back to lines of its own.
const OPTIONAL_CATS = ["greetings", "real_check", "cant_add", "cant_afford", "compliment_reply", "offer_empty",
    "offer_question", "under_offer_close", "under_offer_low", "values_source"];
const CAT_INFO = {
    trade_open:          ["Trade opens", "Sent one after another when a trade opens. <code>%s</code> becomes the value from the advert, e.g. 15+. A first line of just \"heyyy\" gets swapped for a random greeting."],
    good:                ["Good offer", "Said when the offer is enough and it accepts."],
    value_question:      ["\"What are you looking for?\"", "<code>%s</code> becomes e.g. \"15+ elve value\"."],
    built_replies:       ["\"Did you build it?\"", ""],
    traded_replies:      ["\"It's cloned / duped / copied\"", ""],
    inv_access_denied:   ["Inventory access denied", "Said when they don't let it look at their inventory."],
    no_match_found:      ["Nothing suitable", "Said when nothing in their inventory adds up to the price."],
    portal_replies:      ["Asks to trade the door", "When they ask for the portal / door instead."],
    bot_denial_replies:  ["\"Are you a bot?\"", ""],
    other_house_replies: ["Asks for another house", ""],
    there_replies:       ["\"Hello? Are you there?\"", ""],
    greetings:           ["Greetings", "Swapped in for a bare \"heyyy\" at the start of Trade opens."],
    real_check:          ["\"Are you real?\"", ""],
    cant_add:            ["\"Can you add?\"", "When they ask it to add something on its side."],
    cant_afford:         ["\"I don't have more\"", "Said before it declines an offer that stays under."],
    compliment_reply:    ["Compliments", "\"its so cute\", \"nice house\"…"],
    offer_empty:         ["Empty offer", "They accepted with nothing in the trade."],
    offer_question:      ["\"What do you want?\" (empty trade)", ""],
    under_offer_close:   ["Offer a bit under", "Their offer is close to the price."],
    under_offer_low:     ["Offer far under", ""],
    values_source:       ["\"Do you use elve?\"", ""],
};
const DEFAULT_KEYS = ["suggestion_range_offset", "trade_message_delay", "dont_trade_for_more_than"];
// dont_trade_for_more_than is still stored for old scripts, but nothing reads it any more, so it isn't shown.
const SHOWN_KEYS = ["suggestion_range_offset", "trade_message_delay"];
const DEFAULT_INFO = {
    suggestion_range_offset:  ["Suggestion range", "When it suggests a pet from their inventory, it looks for one worth between the price and the price plus this."],
    trade_message_delay:      ["Message delay (s)", "Seconds between the lines of Trade opens."],
    dont_trade_for_more_than: ["Don't trade above", "Kept for older script versions; the current script doesn't use it."],
};
const WEBHOOKS = [
    ["no_houses", "No houses left", "Pinged when an account runs out of houses."],
    ["success",   "Successful trades", ""],
    ["failed",    "Failed trades", ""],
    ["chat_log",  "Chat logs", ""],
];
const TABS = [["accounts", "Accounts"], ["messages", "Messages"], ["adverts", "Adverts"], ["positions", "Positions"], ["general", "General"]];
const RE_GROUP = /^[A-Za-z0-9_]{1,40}$/, RE_ACCOUNT = /^[A-Za-z0-9_]{3,20}$/,
      RE_HOUSE = /^[A-Za-z0-9_ -]{1,60}$/, RE_SET = /^[A-Za-z0-9_ -]{1,40}$/;

const S = {
    view: "inv", loaded: false, busy: false, version: 0, savedAt: 0, doc: null, base: "", history: [],
    tab: "accounts", set: "Default", q: "", sel: new Set(), open: new Set(), openCats: new Set(), posText: null, posErr: "", msg: null,
};
let IMP = null;   // import dialog state

const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
const clone = v => JSON.parse(JSON.stringify(v));
const ci = (a, b) => String(a).localeCompare(String(b), undefined, { sensitivity: "base", numeric: true });
const plural = (n, w) => `${n} ${n === 1 ? w : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + "ies" : w + "s"}`;
const toLines = text => text.split("\n").map(s => s.trim()).filter(Boolean);
const blankWebhooks = () => Object.fromEntries(WEBHOOKS.map(([k]) => [k, ""]));
const blankDoc = () => ({
    defaults: { suggestion_range_offset: 3, trade_message_delay: 3, dont_trade_for_more_than: 120 },
    message_sets: { Default: {} }, house_adverts: {}, saved_positions: [], groups: {},
});

// Fills in anything missing so the editor never has to check.
function normalize(doc) {
    const blank = blankDoc();
    for (const k of Object.keys(blank)) if (doc[k] === undefined || doc[k] === null) doc[k] = blank[k];
    for (const k of DEFAULT_KEYS) if (doc.defaults[k] === undefined) doc.defaults[k] = blank.defaults[k];
    if (!doc.message_sets.Default) doc.message_sets = { Default: {}, ...doc.message_sets };
    for (const grp of Object.values(doc.groups)) {
        grp.webhooks = { ...blankWebhooks(), ...(grp.webhooks || {}) };
        grp.accounts = grp.accounts || {};
        for (const a of Object.values(grp.accounts)) {
            a.overrides = a.overrides || {};
            a.message_set = a.message_set || "Default";
            if (a.house === undefined) a.house = "";
        }
    }
    return doc;
}

function settingsDirty() { return !!S.doc && (JSON.stringify(S.doc) !== S.base || !!S.posErr); }

function resetSettings() {
    Object.assign(S, { loaded: false, busy: false, version: 0, savedAt: 0, doc: null, base: "", history: [],
        q: "", posText: null, posErr: "", msg: null });
    S.sel.clear(); S.open.clear(); S.openCats.clear();
    IMP = null;
    closeModal();
    for (const id of ["setTabs", "setMsg", "setBody", "setState"]) $(id).innerHTML = "";
    showView("inv");
}

window.addEventListener("beforeunload", e => { if (password && settingsDirty()) { e.preventDefault(); e.returnValue = ""; } });

// ── talking to the Worker ────────────────────────────────────────────────────
async function post(path, extra) {
    let res;
    try {
        res = await fetch(API + path, {
            method: "POST", headers: { "Content-Type": "application/json" }, cache: "no-store",
            body: JSON.stringify({ password, ...extra }),
        });
    } catch {
        return { kind: "offline" };
    }
    let body = null;
    try { body = await res.json(); } catch {}
    if (res.ok && body) return { kind: "ok", body };
    if (res.status === 401) return { kind: "wrong" };
    if (res.status === 409) return { kind: "conflict", body: body || {} };
    if (res.status === 429) return { kind: "locked", retryAfter: (body && body.retryAfter) || 900 };
    return { kind: "error", detail: (body && body.error) || `HTTP ${res.status}` };
}
const failText = r => r.kind === "offline" ? "can't reach the dashboard server"
    : r.kind === "locked" ? `locked out for ${waitWords(r.retryAfter)}` : r.detail;

// ── switching pages ──────────────────────────────────────────────────────────
function showView(v) {
    S.view = v;
    $("nav").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
    $("invView").hidden = v !== "inv";
    $("stats").hidden = v !== "inv";
    $("setView").hidden = v !== "set";
    if (v !== "set") return;
    if (!S.loaded) loadSettings(); else renderSettings();
}
$("nav").addEventListener("click", e => {
    const b = e.target.closest("[data-view]");
    if (b && password) showView(b.dataset.view);
});

async function loadSettings() {
    if (S.busy) return;
    S.busy = true;
    $("setSave").disabled = $("setDiscard").disabled = true;
    $("setBody").innerHTML = `<div class="empty">Loading settings…</div>`;
    const mine = session;
    const r = await post("/api/settings/load");
    if (mine !== session) return;
    S.busy = false;
    if (r.kind === "wrong") return lock("The password was changed. Enter the new one.");
    if (r.kind !== "ok") {
        $("setBody").innerHTML = `<div class="card empty">Couldn't load the settings: ${esc(failText(r))}.<br><br>
            <button class="btn" data-act="reload">Try again</button></div>`;
        return;
    }
    adopt(r.body);
}

function adopt(body) {
    S.loaded = true;
    S.version = body.version || 0;
    S.savedAt = body.savedAt || 0;
    if (body.history) S.history = body.history;
    S.doc = normalize(body.doc ? body.doc : blankDoc());
    S.base = JSON.stringify(S.doc);
    S.posText = null; S.posErr = "";
    S.sel.clear();
    if (!S.doc.message_sets[S.set]) S.set = "Default";
    if (!S.version) {
        S.msg = { kind: "info", html: `Nothing saved yet. Press <b>Import</b> to load your settings.lua files, then <b>Save</b>.` };
    }
    renderSettings();
}

// ── looking things up in the doc ─────────────────────────────────────────────
function findAcct(name, doc = S.doc) {
    const low = name.toLowerCase();
    for (const [g, grp] of Object.entries(doc.groups)) {
        for (const n of Object.keys(grp.accounts)) if (n.toLowerCase() === low) return { g, name: n, a: grp.accounts[n] };
    }
    return null;
}
function allAccounts() {
    const out = [];
    for (const [g, grp] of Object.entries(S.doc.groups)) for (const [name, a] of Object.entries(grp.accounts)) out.push({ g, name, a });
    return out;
}
const setNames = () => ["Default", ...Object.keys(S.doc.message_sets).filter(s => s !== "Default").sort(ci)];
function houseNames() {
    const s = new Set(Object.keys(S.doc.house_adverts));
    for (const { a } of allAccounts()) if (a.house.trim()) s.add(a.house.trim());
    return [...s].sort(ci);
}
function usage(field) {          // field value -> [account names]
    const m = {};
    for (const { name, a } of allAccounts()) (m[a[field].trim ? a[field].trim() : a[field]] ??= []).push(name);
    return m;
}
// Rebuilds an object with one key renamed, keeping the order.
function renameKey(obj, from, to) {
    const out = {};
    for (const [k, v] of Object.entries(obj)) out[k === from ? to : k] = v;
    return out;
}

}

function renderMsg() {

function say(kind, html) { S.msg = { kind, html }; renderMsg(); }

// Messages ────────────────────────────────────────────────────────────────────
function messagesTab() {
    if (!S.doc.message_sets[S.set]) S.set = "Default";
    const used = usage("message_set");
    const isDef = S.set === "Default";
    const set = S.doc.message_sets[S.set];
    const def = S.doc.message_sets.Default;
    const known = new Set([...REQUIRED_CATS, ...OPTIONAL_CATS]);
    const extra = [...new Set(Object.values(S.doc.message_sets).flatMap(Object.keys))].filter(c => !known.has(c));

    const list = setNames().map(s => `<button class="s-setbtn ${s === S.set ? "on" : ""}" data-act="pickSet" data-set="${esc(s)}">
        <b>${esc(s)}</b><span>${plural((used[s] || []).length, "account")}</span></button>`).join("");

    const cats = [...REQUIRED_CATS, ...OPTIONAL_CATS, ...extra];
    const allOpen = cats.every(c => S.openCats.has(c));

    const catCard = cat => {
        const lines = set[cat] || [];
        const [title, help] = CAT_INFO[cat] || [cat, "Not used by the current script."];
        const [status, cls] = catStatus(cat);
        let placeholder = "One message per line";
        let copy = "";
        if (!isDef && !lines.length) {
            const d = def[cat] || [];
            placeholder = d.length ? "Using Default's lines:\n" + d.slice(0, 6).join("\n") + (d.length > 6 ? "\n…" : "") : "Using Default's (empty)";
            if (d.length) copy = `<button class="btn small" data-act="copyDef" data-cat="${cat}">Copy Default's lines to edit</button>`;
        }
        const tip = (help ? help.replace(/<[^>]+>/g, "") + " " : "") + `(${cat})`;
        return `<details class="s-cat" data-catbox="${esc(cat)}" ${S.openCats.has(cat) ? "open" : ""}>
            <summary title="${esc(tip)}">${esc(title)}<span class="s-count ${cls}" data-count="${esc(cat)}">${status}</span></summary>
            <div class="s-cat-body"><textarea class="ta" data-cat="${esc(cat)}" rows="${Math.min(14, Math.max(3, lines.length + 1))}" spellcheck="false"
                placeholder="${esc(placeholder)}">${esc(lines.join("\n"))}</textarea>${copy}</div></details>`;
    };

    return `<div class="s-cols">
        <div class="card s-sets"><h3>Message sets</h3>
            ${list}
            <button class="btn" style="width:100%;margin-top:12px" data-act="newSet">+ New set</button>
        </div>
        <div class="card">
            <h2>${esc(S.set)}${isDef ? "" : ` <span class="s-pill" title="Empty categories use Default's lines">changes Default</span>`}
                <span class="s-tools">
                <button class="btn small" data-act="toggleCats">${allOpen ? "Collapse all" : "Expand all"}</button>
                ${isDef ? "" : `<button class="btn small" data-act="renameSet">Rename</button>`}
                <button class="btn small" data-act="dupSet">Duplicate</button>
                ${isDef ? "" : `<button class="btn small danger" data-act="deleteSet">Delete</button>`}
            </span></h2>
            ${REQUIRED_CATS.map(catCard).join("")}
            <div class="s-sep">Rarely used</div>
            ${OPTIONAL_CATS.map(catCard).join("")}
            ${extra.length ? `<div class="s-sep" title="Came in from an import; the current script doesn't use them">Not used</div>${extra.map(catCard).join("")}` : ""}
        </div></div>`;
}

// The right-hand label of a category row: [text, class].
function catStatus(cat) {
    const n = (S.doc.message_sets[S.set][cat] || []).length;
    if (n) return [plural(n, "line"), ""];
    if (S.set !== "Default") return ["uses Default", ""];
    return REQUIRED_CATS.includes(cat) ? ["empty, needs a line", "s-bad"] : ["script's own lines", ""];
}

            <div class="s-note s-warn" data-elve>${elveWarning(lines)}</div>

const elveWarning = lines => {
    const n = lines.filter(l => !/\d+\s*(\+|-\s*\d+)?\s*elve/i.test(l)).length;

// Positions ───────────────────────────────────────────────────────────────────
const cfText = p => `CFrame.new(${p.join(", ")})`;
function positionsTab() {
    const text = S.posText ?? S.doc.saved_positions.map(cfText).join("\n");
    return `<div class="card">
        <h2>Door positions <span class="s-pill" id="posCount">${plural(S.doc.saved_positions.length, "position")}</span></h2>
        <textarea class="ta" id="posTa" title="One CFrame.new(…) per line; the script picks one per server" style="margin-top:10px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;white-space:pre;overflow-x:auto"
            rows="${Math.min(20, Math.max(6, S.doc.saved_positions.length + 2))}" spellcheck="false"
            placeholder="CFrame.new(6013.0, 10359.6, -12006.0, 0.0088, 0, -0.9999, 0, 1, 0, 0.9999, 0, 0.0088)">${esc(text)}</textarea>
        <div class="s-note s-bad" id="posErr">${esc(S.posErr)}</div>
    </div>`;
}
function parsePositions(text) {
    const out = [];
    const rows = text.split("\n");
    for (let i = 0; i < rows.length; i++) {
        const raw = rows[i].trim().replace(/,$/, "");
        if (!raw) continue;
        const m = /^(?:CFrame\.new\s*)?\(?([^()]*)\)?$/.exec(raw);
        const nums = m ? m[1].split(",").map(s => s.trim()).filter(Boolean).map(Number) : [];
        if (!m || !nums.every(Number.isFinite) || (nums.length !== 12 && nums.length !== 3)) {
            return { err: `Line ${i + 1} isn't a CFrame.new(…) with 12 numbers.` };
        }
        out.push(nums.length === 3 ? [...nums, 1, 0, 0, 0, 1, 0, 0, 0, 1] : nums);
    }
    if (out.length > 50) return { err: "There can be at most 50 positions." };
    return { list: out };
}

}

// ── editing ──────────────────────────────────────────────────────────────────
function changed() { renderSaveState(); }

$("setBody").addEventListener("input", e => {
    const t = e.target;
    if (t.type === "checkbox") return;
    if (t.id === "sq") {
        S.q = t.value;
        const at = t.selectionStart;
        renderSettings();
        const q = $("sq"); q.focus(); q.setSelectionRange(at, at);
        return;
    }
    const tr = t.closest("tr[data-a]");
    if (tr && t.dataset.f) {
        const found = findAcct(tr.dataset.a);
        if (!found) return;
        const a = found.a, f = t.dataset.f, v = t.value;
        if (f === "house") a.house = v;
        else if (f === "min_accept") a.min_accept = v === "" ? "" : Number(v);
        else if (f === "message_set") a.message_set = v;
        else if (f.startsWith("ov.")) {
            const k = f.slice(3);
            if (v === "") delete a.overrides[k]; else a.overrides[k] = Number(v);
        }
        return changed();
    }
    if (t.dataset.cat !== undefined && t.tagName === "TEXTAREA") {
        const set = S.doc.message_sets[S.set], cat = t.dataset.cat;
        const lines = toLines(t.value);
        if (lines.length) set[cat] = lines; else delete set[cat];
        const c = $("setBody").querySelector(`[data-count="${CSS.escape(cat)}"]`);
        if (c) { const [text, cls] = catStatus(cat); c.textContent = text; c.className = `s-count ${cls}`; }
        return changed();
    }
    if (t.dataset.adverts !== undefined) {
        const card = t.closest("[data-house]");
        const lines = toLines(t.value);
        S.doc.house_adverts[card.dataset.house] = lines;
        card.querySelector("[data-elve]").textContent = elveWarning(lines);
        return changed();
    }
    if (t.id === "posTa") {
        S.posText = t.value;
        const r = parsePositions(t.value);
        S.posErr = r.err || "";
        if (r.list) S.doc.saved_positions = r.list;
        $("posErr").textContent = S.posErr;
        $("posCount").textContent = plural(S.doc.saved_positions.length, "position");
        return changed();
    }
    if (t.dataset.def) {
        S.doc.defaults[t.dataset.def] = t.value === "" ? "" : Number(t.value);
        return changed();
    }
    if (t.dataset.wh) {
        S.doc.groups[t.closest("[data-g]").dataset.g].webhooks[t.dataset.wh] = t.value.trim();
        return changed();
    }
});

// The house column's "no adverts" note only refreshes after leaving the field.
$("setBody").addEventListener("change", e => {
    if (e.target.dataset.f === "house") {

        td.insertAdjacentHTML("beforeend", houseNote(found.a.house.trim()));
