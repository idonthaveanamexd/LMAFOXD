}

// ── house files (Houses page) ────────────────────────────────────────────────
// Stored by the Worker; senders download the one their receiver wants from there.
const rsSize = b => b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`;
const rsHouse = name => name ? rsD().houseFiles.find(h => h.name.toLowerCase() === String(name).toLowerCase()) : undefined;
const rsHouseUse = name => rsD().receivers.filter(r => r.house === name).length;
// "mermaid (2).lua" → "mermaid 2"
const rsFileName = f => f.replace(/\.(lua|json|txt)$/i, "").replace(/[^A-Za-z0-9_ -]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 60);
const RS_MAX_FILE = 1.9e6;

// A quick look inside a house file, the same thing the script's loadHouseFile reads:
// JSON (a "furnitures" list or a "furniture" table, whatever the file is called) or one
// Lua table. It only counts things; the script does the real parsing.
function rsParseHouse(text) {
    const s = text.trim();
    if (!s) return null;
    if (!/^(return\b|[{[])/.test(s)) return { error: "That doesn't look like a house file. It should start with <code>{</code> or <code>return {</code>." };
    if (!/(\}|\]\])$/.test(s)) return { error: "The file looks cut off, it should end with <code>}</code>. Copy the whole file." };
    const bytes = new Blob([s]).size;
    if (bytes > RS_MAX_FILE) return { error: `It's ${rsSize(bytes)}, the most the dashboard keeps is ${rsSize(RS_MAX_FILE)}.` };
    const json = rsJson(s);
    return json ? rsJsonHouse(json, bytes) : rsLuaHouse(s, bytes);
}

// The JSON inside, the ways the script finds it: the whole file, `return [[ json ]]` or
// `return json`, each also with one stray character at the end dropped.
function rsJson(s) {
    const body = /^\{|^\[/.test(s) ? s : (s.match(/^return\s*\[\[([\s\S]*)\]\]$/) || s.match(/^return\s+([{[][\s\S]*)$/) || [])[1];
    if (!body) return null;
    for (const t of [body, body.slice(0, -1)]) {
        try { const d = JSON.parse(t); if (isObj(d)) return d; } catch {}
    }
    return null;
}

const rsTop5 = ids => {
    const count = {};
    for (const id of ids) if (typeof id === "string" && id) count[id] = (count[id] || 0) + 1;
    return [Object.keys(count).length, Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 5)];
};

function rsJsonHouse(d, bytes) {
    const list = Array.isArray(d.furnitures) ? d.furnitures : isObj(d.furniture) ? Object.values(d.furniture) : null;
    if (!list) return { error: "No furniture found in it (no <code>furnitures</code> list or <code>furniture</code> table)." };
    const items = list.filter(isObj);
    if (!items.length) return { error: "Its furniture list is empty." };
    // the script can only place an item with a 12-number cframe
    if (!items.some(f => Array.isArray(f.cframe) && f.cframe.length === 12))
        return { error: "None of its furniture has a position (<code>cframe</code>), so it can't be built." };
    const type = d.building_type || d.buildingType;
    if (typeof type !== "string" || !type) return { error: "It doesn't say which house to buy (no <code>buildingType</code>)." };
    const [kinds, top] = rsTop5(items.map(f => f.id));
    const tex = d.textures;
    const rooms = Array.isArray(tex) ? new Set(tex.filter(isObj).map(t => t.room).filter(Boolean)).size : isObj(tex) ? Object.keys(tex).length : 0;
    const music = isObj(d.music) && typeof d.music.name === "string" ? d.music.name : "";
    return { type, items: items.length, kinds, rooms, top, music, bytes };
}

// A Lua table: counted by pattern, the script runs it for real.
function rsLuaHouse(s, bytes) {
    // a ["f-1"] = {...} table, or a furnitures = { {...}, ... } list (one cframe per item)
    const items = (s.match(/\[?"f-\d+"\]?\s*[=:]/g) || []).length
        || (/\bfurnitures"?\s*[=:]/.test(s) ? (s.match(/\bcframe"?\s*[=:]/g) || []).length : 0);
    if (!items) return { error: "No furniture found in it (no <code>[\"f-…\"]</code> entries or <code>furnitures</code> list)." };
    const count = {};
    for (const m of s.matchAll(/[{,]\s*"?id"?\s*[=:]\s*"([^"]+)"/g)) count[m[1]] = (count[m[1]] || 0) + 1;
    return {
        type: (s.match(/(?:building_type|buildingType)"?\s*[=:]\s*"([^"]+)"/) || [])[1] || "",
        items,
        kinds: Object.keys(count).length,
        rooms: new Set(s.match(/\bRoom\d+\b/g) || []).size,
        top: Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 5),
        music: (s.match(/music"?\s*[=:]\s*\{[^}]*?\bname"?\s*[=:]\s*"([^"]*)"/) || [])[1] || "",
        bytes,
    };
}

const RH = { parsed: null, timer: 0, busy: false };
const rsHInfo = (html, cls) => { const el = $("rsHInfo"); el.className = `rs-hinfo ${cls || ""}`; el.innerHTML = html; };
// Says what's in the box and whether it can be added.
function rsHouseCheck() {
    const p = RH.parsed, name = $("rsHName").value.trim(), btn = $("rsHAdd");
    const old = name && rsHouse(name), use = old ? rsHouseUse(old.name) : 0;
    btn.textContent = RH.busy ? "Uploading…" : old ? "Replace house" : "Add house";
    btn.disabled = true;
    if (RH.busy) return;
    if (!p) return rsHInfo("");
    if (p.error) return rsHInfo(p.error, "bad");
    const what = `<b>${rsN(p.items)}</b> items · <b>${p.kinds}</b> kinds · ${p.rooms} room${rsS(p.rooms)}${p.type ? ` · <span class="house">${esc(p.type)}</span>` : ""} · ${rsSize(p.bytes)}`;
    if (!name) return rsHInfo(`${what}<br>Give it a name.`);
    if (!RE_HOUSE.test(name)) return rsHInfo(`${what}<br><span class="bad">The name can only have letters, numbers, spaces, - and _.</span>`);
    btn.disabled = false;
    rsHInfo(old ? `${what}<br>Replaces the <b>${esc(old.name)}</b> file${use ? `, used by ${use} receiver${rsS(use)}` : ""}.` : what);
}
function rsHouseText() {
    clearTimeout(RH.timer);
    RH.timer = setTimeout(() => { RH.parsed = rsParseHouse($("rsHText").value); rsHouseCheck(); }, 200);
}

// Uploads one file: the body is the file, the rest rides in headers. Same name in any
// case replaces it (the Worker keeps the old name and its measured cost).
async function rsUpload(name, text, p) {
    let res, body = null;
    try {
        res = await fetch(API + "/api/restock/house/add", {
            method: "POST", body: text, cache: "no-store",
            headers: {
                "Content-Type": "text/plain; charset=utf-8", "X-Password": encodeURIComponent(password),
                "X-House-Name": encodeURIComponent(name),
                "X-House-Meta": encodeURIComponent(JSON.stringify({ type: p.type, items: p.items, kinds: p.kinds, rooms: p.rooms, top: p.top, music: p.music })),
            },
        });
        if (!res.ok) return ivFailure(res);
        body = await res.json();
    } catch {
        return res ? { kind: "error", detail: "the Worker sent back something unreadable" } : { kind: "offline" };
    }
    return { kind: "ok", body };
}

async function rsHouseAdd() {
    if (RH.busy) return;
    const text = $("rsHText").value, name = $("rsHName").value.trim();
    clearTimeout(RH.timer);
    const p = RH.parsed = rsParseHouse(text);
    if (!p || p.error || !RE_HOUSE.test(name)) return rsHouseCheck();
    const replaced = !!rsHouse(name);
    RH.busy = true;
    rsHouseCheck();
    const mine = session;
    const r = await rsUpload(name, text.trim(), p);
    if (mine !== session) return;
    RH.busy = false;
    if (!rsAnswer(r, mine)) { rsHouseCheck(); return rsHInfo(`Couldn't add it: ${esc(RS.err || "the password was changed")}.`, "bad"); }
    $("rsHText").value = $("rsHName").value = "";
    RH.parsed = null;
    rsHouseCheck();
    rsHInfo(`${replaced ? "Replaced" : "Added"} <b>${esc(rsHouse(name)?.name || name)}</b>. Every receiver can pick it now.`, "ok");
    renderRestock(true);
}

// One file: fill the box so it can be checked and named. Several: add them all,
// named after their files.
async function rsHouseFiles(files) {
    files = [...files];
    if (!files.length || RH.busy) return;
    if (files.length === 1) {
        const f = files[0];
        $("rsHText").value = await f.text();
        $("rsHName").value = rsFileName(f.name);
        RH.parsed = rsParseHouse($("rsHText").value);
        return rsHouseCheck();
    }
    const added = [], skipped = [], mine = session;
    RH.busy = true;
    rsHouseCheck();
    for (const f of files) {
        const text = await f.text(), p = rsParseHouse(text), name = rsFileName(f.name);
        if (!p || p.error) { skipped.push(`${esc(f.name)}: ${p ? p.error : "empty"}`); continue; }
        if (!RE_HOUSE.test(name)) { skipped.push(`${esc(f.name)}: needs a different file name`); continue; }
        rsHInfo(`Uploading <b>${esc(name)}</b>…`);
        const r = await rsUpload(name, text.trim(), p);
        if (mine !== session) return;
        if (rsAnswer(r, mine)) added.push(`<b>${esc(name)}</b>`);
        else if (mine !== session) return;
        else skipped.push(`${esc(f.name)}: ${esc(RS.err)}`);
    }
    RH.busy = false;
    rsHouseCheck();
    renderRestock(true);
    rsHInfo(`${added.length ? `Added ${added.join(", ")}.` : "Nothing added."}${skipped.length ? `<br><span class="bad">Skipped ${skipped.join("; ")}</span>` : ""}`, skipped.length ? "" : "ok");
}

function renderRsHouses() {
    const D = rsD(), list = D.houseFiles;
    $("rsHouseN").textContent = list.length;
    $("rsHListN").textContent = list.length;
    // picked for a receiver but there's no file: the script can't restock those

            return `<div class="rs-note bad rs-hmiss">No file for <b>${esc(h)}</b>, picked for ${n} receiver${rsS(n)}. Add it here or ${n === 1 ? "it" : "they"} can't be restocked.</div>`; }).join("")
        + (list.length ? list.map(h => {
            const use = rsHouseUse(h.name);
            return `<div class="rs-hc${use ? "" : " unused"}" data-rs-house="${esc(h.name)}">
                <div class="rs-hc-top"><h3 title="${esc(h.name)}">${esc(h.name)}</h3>${h.type ? `<span class="house">${esc(h.type)}</span>` : ""}
                    <button type="button" class="rs-x" data-rs-hrm title="Delete this house file">✕</button></div>
                <div class="rs-hc-cost" title="What one clone took the sender, measured from its bucks before and after">${h.cost
                    ? `~${rsBucks(h.cost)} a house`

                <div class="rs-hc-nums"><span><b>${rsN(h.items)}</b> items</span><span><b>${h.kinds}</b> kinds</span><span><b>${h.rooms}</b> room${rsS(h.rooms)}</span><span>${rsSize(h.bytes)}</span></div>
                <div class="rs-tags" title="Most used furniture">${h.top.map(([id, n]) => `<span>${esc(id)} <i>×${n}</i></span>`).join("")}</div>
                ${h.music ? `<div class="rs-hc-music">♪ ${esc(h.music)}</div>` : ""}
                <div class="rs-hc-foot"><span>${use ? `used by <b>${use}</b> receiver${rsS(use)}` : "not used yet"} · added <span title="${esc(exact(h.added))}">${ago(Date.now() - h.added)}</span></span>

    // unchanged: leave it, so a half-clicked ✕ isn't reset
    const el = $("rsHList");
    if (el.rsHtml !== html) el.innerHTML = el.rsHtml = html;
}

async function rsHouseRemove(card, btn) {
    if (!rsArm(btn, "Delete?")) return;
    clearTimeout(btn.rsT);
    btn.disabled = true;
    const mine = session;
    if (rsAnswer(await post("/api/restock/house/delete", { name: card.dataset.rsHouse }), mine)) return renderRestock(true);
    if (mine !== session || !btn.isConnected) return;
    btn.classList.remove("armed");
    btn.disabled = false;
    btn.textContent = "✕";
    btn.title = RS.err;
}
async function rsHouseDownload(card, btn) {
    const name = card.dataset.rsHouse, mine = session;
    btn.disabled = true;
    let r;
    try {
        const res = await fetch(API + "/api/restock/house/download", {
            method: "POST", headers: { "Content-Type": "application/json" }, cache: "no-store",
            body: JSON.stringify({ password, name }),
        });
        r = res.ok ? { kind: "ok", blob: await res.blob() } : await ivFailure(res);
    } catch {
        r = { kind: "offline" };
    }
    if (mine !== session) return;
    btn.disabled = false;
    if (r.kind === "wrong") return lock("The password was changed. Enter the new one.");
    if (r.kind !== "ok") { btn.title = failText(r); RS.err = failText(r); return rsSync(); }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(r.blob);
    a.download = `${name}.lua`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function rsPage(p) {
    RS.page = p;
    $("rsMain").hidden = p !== "main";
    $("rsHousesPage").hidden = p !== "houses";
    $("rsPages").querySelectorAll("[data-rs-page]").forEach(b => {
        b.classList.toggle("on", b.dataset.rsPage === p);
        b.setAttribute("aria-pressed", b.dataset.rsPage === p);
    });
}

// Everything that stopped a restock. "Out of bucks" isn't an error in the script (the
// receiver re-queues), but it's still a restock that didn't finish, so it's listed too.
function rsFailures() {
    const D = rsD();
    return [...D.failed, ...D.partial.map(x => ({ id: x.id, sender: x.sender, receiver: x.receiver, house: x.house, stage: "out of bucks",
            before: x.before, after: x.stoppedAt,
            error: `Sender ran out of bucks${x.moneyLeft != null ? ` (${rsN(x.moneyLeft)} left)` : ""}. ${x.receiver} went back in the queue for the other ${x.needed} house${rsS(x.needed)}.`, finish: x.finish }))]
        .sort((a, b) => b.finish - a.finish);
}

// full: rebuild the receiver cards too (opening the tab, a save). A poll rebuilds them
// only when the list itself changed and nobody is typing in one; otherwise it patches the tops.
function renderRestock(full) {
    const D = rsD();
    rsSync();
    renderRsHead();
    renderRsHouses();
    if (full || (RS.key !== rsCardsKey() && !rsEditing()) || !$("rsAccts").firstElementChild) renderRsAccts(); else rsPatchAccts();
    const fails = rsFailures();
    const day = Date.now() - 24 * 3600e3;
    const housesToday = D.traded.filter(x => x.finish > day).reduce((a, x) => a + x.after - x.before, 0)
        + D.slots.reduce((a, x) => a + x.final - x.start, 0)
        + D.partial.filter(x => x.finish > day).reduce((a, x) => a + x.stoppedAt - x.before, 0);
    $("rsStats").innerHTML = [
        [D.slots.length, "Restocking now"],
        [D.waitingReceivers.length, "Waiting for a sender"],
        [rsN(Math.max(0, housesToday)), "Houses traded · 24h"],
        [fails.length, "Failed", fails.length ? "out" : ""],
    ].map(([v, l, cls]) => `<div class="stat"><span>${l}</span><b class="${cls || ""}">${v}</b></div>`).join("");

    $("rsFailN").textContent = fails.length;
    $("rsFail").innerHTML = fails.length ? fails.map(x => `<div class="rs-fail">
            <div class="rs-fail-top">
                <span class="rs-id">${x.id ? "#" + x.id : "setup"}</span>
                <span>${rsPair(x.sender, x.receiver)}</span>
                ${x.house ? `<span class="house">${esc(x.house)}</span>` : ""}
                ${x.stage ? `<span class="rs-stage" title="Where the script was when it stopped">stage: ${esc(x.stage)}</span>` : ""}
                <span class="rs-time" title="${esc(exact(x.finish))}">${ago(Date.now() - x.finish)}</span>
            </div>
            <pre>${esc(x.error)}</pre>
            ${x.before != null ? `<div class="rs-fail-meta"><span>Houses before <b>${x.before}</b></span><span>Houses after <b>${x.after ?? "?"}</b></span></div>` : ""}
        </div>`).join("") : rsNone(RS.at ? "Nothing has failed." : "-");
}

$("rsView").addEventListener("click", e => {
    const pg = e.target.closest("[data-rs-page]");
    if (pg) return rsPage(pg.dataset.rsPage);
    const card = e.target.closest("[data-rs-house]");
    if (card) {
        const rm = e.target.closest("[data-rs-hrm]"), dl = e.target.closest("[data-rs-hdl]");
        if (rm) rsHouseRemove(card, rm);
        if (dl) rsHouseDownload(card, dl);
        return;
    }
    const row = e.target.closest("[data-rs-acct]");
    if (!row) return;
    if (e.target.closest("[data-rs-save]")) rsSave(row);
    const rm = e.target.closest("[data-rs-rm]");
    if (rm) rsRemove(row, rm);
});
$("rsAccts").addEventListener("input", e => {
    const row = e.target.closest("[data-rs-acct]"), r = row && rsAcct(row.dataset.rsAcct);
    if (!r) return;
    rsRedrawTop(row, r);
    const save = row.querySelector("[data-rs-save]");
    save.disabled = !rsDirty(row, r);
    save.classList.remove("saved");
    save.textContent = "Save";
    save.title = "";
    e.target.closest(".in")?.classList.remove("bad");
});
$("rsHText").addEventListener("input", rsHouseText);
$("rsHName").addEventListener("input", rsHouseCheck);
$("rsHName").addEventListener("keydown", e => { if (e.key === "Enter" && !$("rsHAdd").disabled) rsHouseAdd(); });
$("rsHAdd").addEventListener("click", rsHouseAdd);
$("rsHClear").addEventListener("click", () => { if (RH.busy) return; $("rsHText").value = $("rsHName").value = ""; RH.parsed = null; rsHouseCheck(); });
$("rsHPick").addEventListener("click", () => $("rsHFile").click());
$("rsHFile").addEventListener("change", e => { rsHouseFiles(e.target.files); e.target.value = ""; });
$("rsHText").addEventListener("dragover", e => { e.preventDefault(); e.target.classList.add("drag"); });
$("rsHText").addEventListener("dragleave", e => e.target.classList.remove("drag"));
$("rsHText").addEventListener("drop", e => {
    e.target.classList.remove("drag");
    if (!e.dataTransfer.files.length) return;
    e.preventDefault();
    rsHouseFiles(e.dataTransfer.files);
});
$("rsAccts").addEventListener("keydown", e => {
    const row = e.key === "Enter" && e.target.matches("input.in, .in input") && e.target.closest("[data-rs-acct]");
    if (row) rsSave(row);
});

// Running timers tick every second without redrawing the page.
setInterval(() => {
    if ($("rsView").hidden) return;
    document.querySelectorAll("[data-rs-since]").forEach(el => { el.textContent = rsDur(Date.now() - Number(el.dataset.rsSince)); });
}, 1000);
</script>
</body>
</html>
