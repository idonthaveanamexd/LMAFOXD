function askName(question, current, re, rule) {
    const v = prompt(question, current || "");
    if (v === null) return null;
    const name = v.trim();
    if (!re.test(name)) { alert(`"${name}" won't work: ${rule}`); return null; }
    return name;
}

const ACTIONS = {
    // save bar
    save: () => save(),
    forceSave: el => save(Number(el.dataset.v)),
    discard: () => {
        if (!confirm("Throw away all changes since the last save?")) return;
        S.doc = JSON.parse(S.base); S.posText = null; S.posErr = ""; S.msg = null;
        renderSettings();
    },
    reload: () => {
        if (settingsDirty() && !confirm("Load the saved settings and lose your changes here?")) return;
        S.msg = null; S.loaded = true;
        loadSettings();
    },
    import: () => openImport(),
    history: () => openHistory(),

    // accounts
    addGroup: () => {
        const g = askName("Name of the new group (letters, numbers and _):", "", RE_GROUP, "use only letters, numbers and _.");
        if (!g) return;
        if (Object.keys(S.doc.groups).some(x => x.toLowerCase() === g.toLowerCase())) return alert(`There's already a group called ${g}.`);
        S.doc.groups[g] = { webhooks: blankWebhooks(), accounts: {} };
        changed(); renderSettings();
    },
    renameGroup: el => {
        const g = el.closest("[data-g]").dataset.g;
        const to = askName(`New name for the group "${g}":`, g, RE_GROUP, "use only letters, numbers and _.");
        if (!to || to === g) return;
        if (S.doc.groups[to]) return alert(`There's already a group called ${to}.`);
        S.doc.groups = renameKey(S.doc.groups, g, to);
        changed(); renderSettings();
    },
    deleteGroup: el => {
        const g = el.closest("[data-g]").dataset.g;
        const n = Object.keys(S.doc.groups[g].accounts).length;
        if (!confirm(n ? `Delete the group "${g}" and its ${plural(n, "account")}?` : `Delete the group "${g}"?`)) return;
        for (const name of Object.keys(S.doc.groups[g].accounts)) S.sel.delete(name);
        delete S.doc.groups[g];
        changed(); renderSettings();
    },
    addAccounts: el => {
        const card = el.closest("[data-g]");
        const g = card.dataset.g;
        const input = card.querySelector("[data-addnames]");
        const names = input.value.split(/[\s,;]+/).filter(Boolean);
        if (!names.length) return input.focus();
        const accts = Object.values(S.doc.groups[g].accounts);
        // New accounts start like the group's most common setup; change what differs.
        const common = key => {
            const count = new Map();
            for (const a of accts) count.set(a[key], (count.get(a[key]) || 0) + 1);
            return [...count].sort((x, y) => y[1] - x[1])[0]?.[0];
        };
        const bad = [], dup = [];
        for (const n of names) {
            if (!RE_ACCOUNT.test(n)) { bad.push(n); continue; }
            const had = findAcct(n);
            if (had) { dup.push(`${n} (in ${had.g})`); continue; }
            S.doc.groups[g].accounts[n] = { house: common("house") || "", min_accept: common("min_accept") ?? 0, message_set: "Default", overrides: {} };
        }
        input.value = "";
        S.msg = bad.length || dup.length ? { kind: "bad", html:
            (bad.length ? `Not Roblox usernames: ${esc(bad.join(", "))}. ` : "") +
            (dup.length ? `Already added: ${esc(dup.join(", "))}.` : "") } : null;
        changed(); renderSettings();
    },
    renameAcct: el => {
        const n = el.closest("[data-a]").dataset.a;
        const found = findAcct(n);
        const to = askName(`New username for ${n}:`, n, RE_ACCOUNT, "Roblox usernames are 3-20 letters, numbers or _.");
        if (!to || to === n) return;
        const other = findAcct(to);
        if (other && other.name !== n) return alert(`${to} is already in ${other.g}.`);
        S.doc.groups[found.g].accounts = renameKey(S.doc.groups[found.g].accounts, n, to);
        if (S.sel.delete(n)) S.sel.add(to);
        if (S.open.delete(n)) S.open.add(to);
        changed(); renderSettings();
    },
    deleteAcct: el => {
        const n = el.closest("[data-a]").dataset.a;
        if (!confirm(`Delete ${n}? It goes back to its PC's settings.lua until it's added here again.`)) return;
        const found = findAcct(n);
        delete S.doc.groups[found.g].accounts[found.name];
        S.sel.delete(n); S.open.delete(n);
        changed(); renderSettings();
    },
    toggleMore: el => {
        const n = el.closest("[data-a]").dataset.a;
        S.open.has(n) ? S.open.delete(n) : S.open.add(n);
        renderSettings();
    },
    sel: el => {
        const n = el.closest("[data-a]").dataset.a;
        el.checked ? S.sel.add(n) : S.sel.delete(n);
        renderSettings();
    },
    selAll: el => {
        el.closest("[data-g]").querySelectorAll("tbody tr[data-a]:not(.s-extra)").forEach(tr => {
            el.checked ? S.sel.add(tr.dataset.a) : S.sel.delete(tr.dataset.a);
        });
        renderSettings();
    },
    bulk: el => {
        const k = el.dataset.k;
        const picked = [...S.sel].map(n => findAcct(n)).filter(Boolean);
        if (k === "clear") { S.sel.clear(); return renderSettings(); }
        if (k === "house") {
            const h = $("bkHouse").value.trim();
            if (!RE_HOUSE.test(h)) return alert("Type a house name first.");
            picked.forEach(f => { f.a.house = h; });
        } else if (k === "min") {
            const v = $("bkMin").value;
            if (v === "" || !(Number(v) >= 0)) return alert("Type a min accept value first.");
            picked.forEach(f => { f.a.min_accept = Number(v); });
        } else if (k === "set") {
            picked.forEach(f => { f.a.message_set = $("bkSet").value; });
        } else if (k === "move") {
            const to = $("bkGroup").value;
            for (const f of picked) {
                if (f.g === to) continue;
                delete S.doc.groups[f.g].accounts[f.name];
                S.doc.groups[to].accounts[f.name] = f.a;
            }
        } else if (k === "delete") {
            if (!confirm(`Delete ${plural(picked.length, "account")}?`)) return;
            for (const f of picked) delete S.doc.groups[f.g].accounts[f.name];
            S.sel.clear();
        }
        changed(); renderSettings();
    },

    // messages
    pickSet: el => { S.set = el.dataset.set; renderSettings(); window.scrollTo({ top: 0 }); },
    newSet: () => {
        const name = askName("Name of the new message set:", "", RE_SET, "use letters, numbers, spaces, _ or -.");
        if (!name) return;
        if (Object.keys(S.doc.message_sets).some(s => s.toLowerCase() === name.toLowerCase())) return alert(`There's already a set called ${name}.`);
        S.doc.message_sets[name] = {};
        S.set = name;
        changed(); renderSettings();
    },
    dupSet: () => {
        const name = askName(`Name for the copy of "${S.set}":`, `${S.set} copy`, RE_SET, "use letters, numbers, spaces, _ or -.");
        if (!name) return;
        if (Object.keys(S.doc.message_sets).some(s => s.toLowerCase() === name.toLowerCase())) return alert(`There's already a set called ${name}.`);
        S.doc.message_sets[name] = clone(S.doc.message_sets[S.set]);
        S.set = name;
        changed(); renderSettings();
    },
    renameSet: () => {
        const from = S.set;
        const to = askName(`New name for "${from}":`, from, RE_SET, "use letters, numbers, spaces, _ or -.");
        if (!to || to === from) return;
        if (to.toLowerCase() === "default" || (S.doc.message_sets[to] && to !== from)) return alert(`There's already a set called ${to}.`);
        S.doc.message_sets = renameKey(S.doc.message_sets, from, to);
        for (const { a } of allAccounts()) if (a.message_set === from) a.message_set = to;
        S.set = to;
        changed(); renderSettings();
    },
    deleteSet: () => {
        const users = usage("message_set")[S.set] || [];
        if (!confirm(`Delete the set "${S.set}"?` + (users.length ? ` Its ${plural(users.length, "account")} will use Default.` : ""))) return;
        for (const { a } of allAccounts()) if (a.message_set === S.set) a.message_set = "Default";
        delete S.doc.message_sets[S.set];
        S.set = "Default";
        changed(); renderSettings();
    },
    toggleCats: () => {
        const known = new Set([...REQUIRED_CATS, ...OPTIONAL_CATS]);
        const cats = [...known, ...new Set(Object.values(S.doc.message_sets).flatMap(Object.keys))];
        if (cats.every(c => S.openCats.has(c))) S.openCats.clear(); else cats.forEach(c => S.openCats.add(c));
        renderSettings();
    },
    copyDef: el => {
        const cat = el.dataset.cat;
        const d = S.doc.message_sets.Default[cat];
        if (!d || !d.length) return;
        S.doc.message_sets[S.set][cat] = clone(d);

    },

    // adverts
    addHouse: el => {
        const h = (el.dataset.house || $("newHouse").value).trim();

function act(name, el, e) {
    const fn = ACTIONS[name] || IMPORT_ACTIONS[name];
    if (fn) fn(el, e);
}

$("setView").addEventListener("click", e => {

});

// ── saving ───────────────────────────────────────────────────────────────────
async function save(overVersion) {
    if (S.busy) return;
    if (S.posErr) {
        S.tab = "positions"; renderSettings();
        return say("bad", "Fix the positions first: " + esc(S.posErr));
    }
    S.busy = true;
    $("setSave").textContent = "Saving…";
    renderSaveState();
    const mine = session;
    const r = await post("/api/settings/save", { baseVersion: overVersion ?? S.version, doc: S.doc });
    if (mine !== session) return;
    S.busy = false;
    $("setSave").textContent = "Save";
    if (r.kind === "wrong") return lock("The password was changed. Enter the new one.");
    if (r.kind === "ok") {
        adopt(r.body);
        return say("ok", `Saved (version ${S.version}). Running accounts pick it up within 5 minutes.`);
    }
    renderSaveState();
    if (r.kind === "conflict") {
        return say("bad", `Someone else saved in the meantime (version ${Number(r.body.version) || "?"}).<br>
            <button class="btn small" data-act="reload">Load theirs</button>
            <button class="btn small" data-act="forceSave" data-v="${Number(r.body.version) || 0}">Keep mine</button>`);
    }
    say("bad", `Not saved: ${esc(failText(r))}`);
}

// ── importing settings.lua ───────────────────────────────────────────────────
// A reader for the Lua that settings.lua is written in: tables, text, numbers,
// true/false/nil, comments, and CFrame.new(...). It never runs anything.
function parseLua(src) {
    let i = 0;
    const n = src.length;
    const enc = new TextEncoder(), dec = new TextDecoder();
    const NUM = /^(?:0[xX][0-9a-fA-F]+|(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)/;
    const NAME = /^[A-Za-z_][A-Za-z0-9_]*/;
    const ahead = len => src.slice(i, i + len);
    const fail = msg => { throw new Error(`${msg} (line ${src.slice(0, i).split("\n").length})`); };

    function skip() {
        while (i < n) {
            const c = src[i];
            if (c === " " || c === "\t" || c === "\r" || c === "\n" || c === "﻿" || c === "\f" || c === "\v") { i++; continue; }
            if (c === "-" && src[i + 1] === "-") {
                i += 2;
                const m = /^\[(=*)\[/.exec(ahead(50));
                if (m) {
                    const close = "]" + m[1] + "]";
                    const j = src.indexOf(close, i + m[0].length);
                    i = j < 0 ? n : j + close.length;
                } else {
                    const j = src.indexOf("\n", i);
                    i = j < 0 ? n : j + 1;
                }
                continue;
            }
            return;
        }
    }
    function longString() {
        const m = /^\[(=*)\[/.exec(ahead(50));
        const close = "]" + m[1] + "]";
        let start = i + m[0].length;
        if (src[start] === "\r") start++;
        if (src[start] === "\n") start++;
        const j = src.indexOf(close, start);
        if (j < 0) fail("Text started with [[ never ends");
        i = j + close.length;
        return src.slice(start, j);
    }
    function quoted() {
        const q = src[i++];
        const bytes = [];
        let run = i;
        const flush = end => { if (end > run) bytes.push(...enc.encode(src.slice(run, end))); };
        const simple = { n: 10, t: 9, r: 13, a: 7, b: 8, f: 12, v: 11, "\\": 92, '"': 34, "'": 39, "\n": 10 };
        while (i < n) {
            const c = src[i];
            if (c === q) { flush(i); i++; return dec.decode(new Uint8Array(bytes)); }
            if (c === "\n") fail("Text is missing its closing quote");
            if (c !== "\\") { i++; continue; }
            flush(i);
            i++;
            const e = src[i++];
            if (e in simple) bytes.push(simple[e]);
            else if (e === "\r") { bytes.push(10); if (src[i] === "\n") i++; }
            else if (/[0-9]/.test(e)) {
                let d = e;
                while (d.length < 3 && /[0-9]/.test(src[i])) d += src[i++];
                if (+d > 255) fail("Bad \\ code in text");
                bytes.push(+d);
            } else if (e === "x") {
                const h = ahead(2);
                if (!/^[0-9a-fA-F]{2}$/.test(h)) fail("Bad \\x code in text");
                bytes.push(parseInt(h, 16)); i += 2;
            } else if (e === "z") {
                while (i < n && /\s/.test(src[i])) i++;
            } else if (e === "u") {
                const m = /^\{([0-9a-fA-F]{1,6})\}/.exec(ahead(10));
                if (!m) fail("Bad \\u code in text");
                bytes.push(...enc.encode(String.fromCodePoint(parseInt(m[1], 16)))); i += m[0].length;
            } else fail("Bad \\ code in text");
            run = i;
        }
        fail("Text is missing its closing quote");
    }
    function value() {
        skip();
        const c = src[i];
        if (c === "{") return table();
        if (c === '"' || c === "'") return quoted();
        if (c === "[" && /^\[=*\[/.test(ahead(50))) return longString();
        if (c === "-") {
            i++;
            const v = value();
            if (typeof v !== "number") fail("A - sign before something that isn't a number");
            return -v;
        }
        let m = NUM.exec(ahead(64));
        if (m) { i += m[0].length; return Number(m[0]); }
        m = NAME.exec(ahead(64));
        if (m) {
            const w = m[0];
            i += w.length;
            if (w === "true") return true;
            if (w === "false") return false;
            if (w === "nil") return null;
            skip();
            if (src[i] === ".") {
                i++;
                const m2 = NAME.exec(ahead(64));
                if (!m2) fail(`Can't read "${w}."`);
                i += m2[0].length;
                const fn = w + "." + m2[0];
                skip();
                if (src[i] !== "(") fail(`Can't read ${fn}`);
                i++;
                const args = [];
                skip();
                while (src[i] !== ")") {
                    if (i >= n) fail(`${fn}( is never closed`);
                    args.push(value());
                    skip();
                    if (src[i] === ",") i++;
                    else if (src[i] !== ")") fail(`Expected , or ) in ${fn}(…)`);
                    skip();
                }
                i++;
                if (fn === "CFrame.new" || fn === "Vector3.new") return { __call: fn, args };
                fail(`Can't read ${fn}(…)`);
            }
            fail(`Unknown word "${w}"`);
        }
        fail(i >= n ? "The file ends too early" : `Unexpected "${c}"`);
    }
    function table() {
        i++;
        const arr = [], obj = {};
        let keyed = false;
        for (;;) {
            skip();
            if (i >= n) fail("A { is never closed");
            if (src[i] === "}") { i++; break; }
            if (src[i] === "[" && !/^\[=*\[/.test(ahead(50))) {
                i++;
                const k = value();
                skip();
                if (src[i] !== "]") fail("Expected ]");
                i++; skip();
                if (src[i] !== "=") fail("Expected = after [key]");
                i++;
                obj[String(k)] = value();
                keyed = true;
            } else {
                const m = NAME.exec(ahead(64));
                let j = m ? i + m[0].length : -1;
                if (m) while (j < n && /\s/.test(src[j])) j++;
                if (m && src[j] === "=" && src[j + 1] !== "=") {
                    i = j + 1;
                    obj[m[0]] = value();
                    keyed = true;
                } else arr.push(value());
            }
            skip();
            if (src[i] === "," || src[i] === ";") { i++; continue; }
            if (src[i] === "}") { i++; break; }
            fail("Expected , or } (a comma may be missing)");
        }
        if (!keyed) return arr;
        arr.forEach((v, k) => { obj[String(k + 1)] = v; });
        return obj;
    }

    skip();
    if (src.startsWith("return", i) && !/[A-Za-z0-9_]/.test(src[i + 6] || "")) i += 6;
    else fail("settings.lua should start with return {");
    const result = value();
    skip();
    if (src[i] === ";") { i++; skip(); }
    if (i < n) fail("Something follows the settings table");
    return result;
}

const pairsOf = v => Array.isArray(v) ? v.map((x, k) => [String(k + 1), x]) : isObj(v) ? Object.entries(v) : [];
const textList = v => pairsOf(v).map(([, x]) =>
    typeof x === "string" ? x : isObj(x) ? String(x.text ?? x.message ?? x["1"] ?? "") : "").map(s => s.trim()).filter(Boolean);
function msgTable(m) {
    const out = {};
    for (const [cat, list] of pairsOf(m)) { const l = textList(list); if (l.length) out[cat] = l; }
    return out;
}

// settings.lua as a Lua table -> the pieces the site keeps.
function fromLua(t) {
    if (!isObj(t)) throw new Error("This file doesn't hold a settings table");
    const r = { defaults: {}, messages: null, adverts: {}, positions: null, groups: {}, acctSets: {}, notes: [] };
    for (const k of DEFAULT_KEYS) if (isObj(t.defaults) && typeof t.defaults[k] === "number") r.defaults[k] = t.defaults[k];
    if (t.messages && typeof t.messages === "object") r.messages = msgTable(t.messages);
    for (const [h, v] of pairsOf(t.house_adverts)) {
        const l = typeof v === "string" ? [v.trim()].filter(Boolean) : textList(v);
        if (!RE_HOUSE.test(h)) r.notes.push(`House "${h}" skipped: odd characters in its name`);
        else if (l.length) r.adverts[h] = l;
    }
    if (Array.isArray(t.saved_positions)) {
        r.positions = [];
        for (const p of t.saved_positions) {
            const ok = p && p.__call === "CFrame.new" && p.args.every(x => typeof x === "number") && (p.args.length === 12 || p.args.length === 3);
            if (ok) r.positions.push(p.args.length === 3 ? [...p.args, 1, 0, 0, 0, 1, 0, 0, 0, 1] : p.args);
            else r.notes.push("A position that isn't CFrame.new(…) with 12 numbers was skipped");
        }
    }
    for (const [g, grp] of pairsOf(t.users)) {
        if (!isObj(grp)) continue;
        if (!RE_GROUP.test(g)) { r.notes.push(`Group "${g}" skipped: odd characters in its name`); continue; }
        const w = isObj(grp.Webhook) ? grp.Webhook : {};
        const tr = isObj(w.Trades) ? w.Trades : {};
        const s = v => typeof v === "string" ? v.trim() : "";
        const G = r.groups[g] = { webhooks: { no_houses: s(w.No_Houses), success: s(tr.Succesful_Trade_Link),
            failed: s(tr.Failed_Trade_Link), chat_log: s(tr.Chat_Log_Link) }, accounts: {} };
        for (const [name, a] of Object.entries(grp)) {
            if (name === "Webhook" || !isObj(a)) continue;
            if (!RE_ACCOUNT.test(name)) { r.notes.push(`"${name}" skipped: not a Roblox username`); continue; }
            const acct = { house: typeof a.house_trading === "string" ? a.house_trading.trim() : "",
                min_accept: Number(a.min_accept_value) || 0, message_set: "Default", overrides: {} };
            for (const k of DEFAULT_KEYS) if (typeof a[k] === "number") acct.overrides[k] = a[k];
            if (a.messages && typeof a.messages === "object") {
                const own = msgTable(a.messages);
                if (Object.keys(own).length) { r.acctSets[name] = own; acct.message_set = name; }
            }
            if (!acct.house) r.notes.push(`${name} has no house_trading`);
            G.accounts[name] = acct;
        }
    }
    return r;
}

// Applies one file to a doc; counts what changed into st.
function applyImport(doc, r, o, st) {
    if (o.general) for (const [k, v] of Object.entries(r.defaults)) if (doc.defaults[k] !== v) { doc.defaults[k] = v; st.general = true; }
    if (o.messages && r.messages && Object.keys(r.messages).length) {
        if (JSON.stringify(doc.message_sets.Default) !== JSON.stringify(r.messages)) st.messages = Object.keys(r.messages).length;
        doc.message_sets.Default = clone(r.messages);
    }
    if (o.adverts) for (const [h, l] of Object.entries(r.adverts)) {
        const had = Object.keys(doc.house_adverts).find(x => x.toLowerCase() === h.toLowerCase());
        if (!had) st.housesNew.push(h);
        else if (JSON.stringify(doc.house_adverts[had]) !== JSON.stringify(l)) st.housesChanged.push(h);
        if (had && had !== h) doc.house_adverts = renameKey(doc.house_adverts, had, h);
        doc.house_adverts[h] = clone(l);
    }
    if (o.positions && r.positions && r.positions.length) {
        if (JSON.stringify(doc.saved_positions) !== JSON.stringify(r.positions)) st.positions = r.positions.length;
        doc.saved_positions = clone(r.positions);
    }
    if (o.accounts) for (const [g, G] of Object.entries(r.groups)) {
        if (!doc.groups[g]) { doc.groups[g] = { webhooks: blankWebhooks(), accounts: {} }; st.groupsNew.push(g); }
        for (const [k, url] of Object.entries(G.webhooks)) {
            if (url && doc.groups[g].webhooks[k] !== url) { doc.groups[g].webhooks[k] = url; st.webhooks.add(g); }
        }
        for (const [name, a] of Object.entries(G.accounts)) {
            const had = findAcct(name, doc);
            const next = clone(a);
            if (had) {
                if (a.message_set === "Default") next.message_set = had.a.message_set;   // keep the set chosen on the site
                if (!Object.keys(a.overrides).length) next.overrides = had.a.overrides;
                delete doc.groups[had.g].accounts[had.name];
                if (had.g !== g) st.moved.push(`${name} (${had.g} → ${g})`);
                else if (JSON.stringify(had.a) !== JSON.stringify(next)) st.changed.push(name);
                else st.same++;
            } else st.added.push(name);
            if (r.acctSets[name]) { doc.message_sets[name] = clone(r.acctSets[name]); st.ownSets.push(name); }
            doc.groups[g].accounts[name] = next;
        }
    }
}

function importResult() {
    const doc = clone(S.doc);
    const st = { added: [], changed: [], moved: [], same: 0, groupsNew: [], webhooks: new Set(), housesNew: [],
        housesChanged: [], messages: 0, positions: 0, general: false, ownSets: [] };
    for (const f of IMP.files) if (f.data) applyImport(doc, f.data, IMP.opts, st);
    return { doc, st };
}

function openImport() {
    const D = S.doc;
    IMP = { files: [], opts: {
        accounts: true, adverts: true,
        messages: !Object.keys(D.message_sets.Default).length,
        positions: !D.saved_positions.length,
        general: !S.version,
    } };
    renderImport();
}

function renderImport() {
    const o = IMP.opts;
    const files = IMP.files.map(f => `<div class="s-file"><b>${esc(f.name)}</b>: ${f.error
        ? `<span class="s-bad">${esc(f.error)}</span>`
        : esc(summarize(f.data))}${f.data && f.data.notes.length
        ? `<ul class="s-list s-warn">${[...new Set(f.data.notes)].slice(0, 8).map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}</div>`).join("");
    const opt = (k, title, help) => `<label class="s-check" title="${esc(help)}"><input type="checkbox" data-opt="${k}" ${o[k] ? "checked" : ""}>
        <span>${title}</span></label>`;
    const ready = IMP.files.some(f => f.data);
    let preview = "";
    if (ready) {
        const { st } = importResult();
        const li = [];
        if (st.added.length) li.push(`${plural(st.added.length, "new account")}`);
        if (st.changed.length) li.push(`${plural(st.changed.length, "account")} changed: ${esc(st.changed.slice(0, 10).join(", "))}${st.changed.length > 10 ? "…" : ""}`);
        if (st.moved.length) li.push(`Moved to another group: ${esc(st.moved.join(", "))}`);
        if (st.same) li.push(`${plural(st.same, "account")} already the same`);
        if (st.groupsNew.length) li.push(`New groups: ${esc(st.groupsNew.join(", "))}`);
        if (st.webhooks.size) li.push(`Webhooks filled in for: ${esc([...st.webhooks].join(", "))}`);
        if (st.housesNew.length) li.push(`New houses: ${esc(st.housesNew.join(", "))}`);
        if (st.housesChanged.length) li.push(`Adverts replaced for: ${esc(st.housesChanged.join(", "))}`);
        if (st.ownSets.length) li.push(`Accounts with their own messages (each gets a set named after it): ${esc(st.ownSets.join(", "))}`);
        if (st.messages) li.push(`Default messages replaced (${plural(st.messages, "category")})`);
        if (st.positions) li.push(`Positions replaced (${st.positions})`);
        if (st.general) li.push("General numbers replaced");
        preview = `<h3 style="margin-top:18px">What changes</h3>${li.length ? `<ul class="s-list">${li.map(x => `<li>${x}</li>`).join("")}</ul>`
            : `<p class="s-hint">Nothing: the editor already matches.</p>`}`;
    }
    openModal(`<h2>Import settings.lua</h2>
        <label class="s-drop"><input type="file" id="impFile" accept=".lua,.txt,text/plain" multiple>
            <b>Choose or drop files</b></label>
        <details><summary>…or paste the text</summary>
            <textarea class="ta" id="impPaste" rows="6" style="margin-top:8px" placeholder="return { … }" spellcheck="false"></textarea>
            <button class="btn small" style="margin-top:8px" data-act="impPaste">Read pasted text</button></details>
        ${files ? `<div class="s-files">${files}</div>` : ""}
        <h3 style="margin-top:18px">Take</h3>
        ${opt("accounts", "Accounts, groups and webhooks", "Adds new accounts and updates the house, min accept and own numbers of ones already here. Message sets picked on the site are kept.")}
        ${opt("adverts", "Adverts", "Adds new houses and replaces the adverts of houses in the file.")}
        ${opt("messages", "Messages", "Replaces the Default message set with the file's messages.")}
        ${opt("positions", "Positions", "Replaces the door positions.")}
        ${opt("general", "General numbers", "Replaces suggestion range, message delay, etc.")}
        ${preview}
        <div class="s-foot"><button class="btn" data-act="closeModal">Cancel</button>
            <button class="btn primary" data-act="impApply" ${ready ? "" : "disabled"}>Put into the editor</button></div>`);
}

function summarize(r) {
    const accts = Object.values(r.groups).reduce((s, G) => s + Object.keys(G.accounts).length, 0);
    return [
        `${plural(accts, "account")} in ${Object.keys(r.groups).join(", ") || "no groups"}`,
        plural(Object.keys(r.adverts).length, "house"),
        r.messages ? plural(Object.keys(r.messages).length, "message category") : "no messages",
        r.positions ? plural(r.positions.length, "position") : "no positions",
    ].join(" · ");
}

function addImportText(name, text) {
    try { IMP.files.push({ name, data: fromLua(parseLua(text)) }); }
    catch (err) { IMP.files.push({ name, error: err.message }); }
}

async function readImportFiles(list) {
    for (const f of list) {
        if (f.size > 2e6) { IMP.files.push({ name: f.name, error: "Too big for a settings.lua" }); continue; }
        addImportText(f.name, await f.text());
    }
    renderImport();
}

const IMPORT_ACTIONS = {
    closeModal: () => closeModal(),
    impPaste: () => {
        const text = $("impPaste").value;
        if (!text.trim()) return;
        addImportText(`Pasted text ${IMP.files.length + 1}`, text);
        renderImport();
    },
    impApply: () => {
        const { doc, st } = importResult();
        S.doc = normalize(doc);
        S.posText = null; S.posErr = "";
        closeModal();
        S.tab = "accounts";
        renderSettings();
        say("info", `Imported ${plural(st.added.length, "new account")}, ${plural(st.changed.length + st.moved.length, "changed one")}. Press <b>Save</b> to keep it.`);
    },
    openVersion: async el => {
        if (settingsDirty() && !confirm("Open this version and lose your unsaved changes?")) return;
        const v = Number(el.dataset.v);
        el.disabled = true;
        const mine = session;
        const r = await post("/api/settings/version", { version: v });
        if (mine !== session) return;
        if (r.kind === "wrong") return lock("The password was changed. Enter the new one.");
        if (r.kind !== "ok") { el.disabled = false; return alert("Couldn't open it: " + failText(r)); }
        S.doc = normalize(r.body.doc);
        S.posText = null; S.posErr = ""; S.sel.clear();
        closeModal();
        renderSettings();
        say("info", `Viewing version ${v} (${esc(exact(r.body.savedAt))}). <b>Save</b> restores it, <b>Discard</b> goes back.`);
    },
};

$("modal").addEventListener("change", e => {
    if (!IMP) return;
    if (e.target.id === "impFile") return readImportFiles([...e.target.files]);
    if (e.target.dataset.opt) { IMP.opts[e.target.dataset.opt] = e.target.checked; renderImport(); }
});
$("modal").addEventListener("dragover", e => { if (IMP) e.preventDefault(); });
$("modal").addEventListener("drop", e => {
    if (!IMP) return;
    e.preventDefault();
    readImportFiles([...e.dataTransfer.files]);
});
</script>

<script>
// ══ Item Values page ════════════════════════════════════════════════════════
// The items.json every script prices trades by. A file dropped here is read and
// compared with the list in use right here in the browser; nothing leaves it until
// Upload, which sends the file's exact bytes. Each script.lua learns of a new list
// from its settings check (at every start, then every 5 minutes) and loads it in place.

const IV_PAGE = 100;            // price list rows per "Show more"
const IV_TOP = 10;              // biggest price changes listed before an upload
const IV_NAMES_MAX = 300;       // names listed under "new" / "gone" / "all price changes"
const IV_TYPE_ORDER = ["pet", "petwear", "transport", "toy", "stroller", "egg", "gift", "potion"];
const IV_AGE = { newborn: "Newborn", junior: "Junior", pre_teen: "Pre-teen", teen: "Teen", post_teen: "Post-teen",
    full_grown: "Full grown", reborn: "Reborn", twinkle: "Twinkle", luminous: "Luminous" };
const IV_TYPE_ALIAS = { pets: "pet", petwears: "petwear", petaccessory: "petwear", petaccessories: "petwear", petwearids: "petwear",
    potions: "potion", food: "potion", foods: "potion", eggs: "egg", toys: "toy", strollers: "stroller", transports: "transport",
    vehicle: "transport", vehicles: "transport", car: "transport", cars: "transport", gifts: "gift" };
const ivColl = new Intl.Collator(undefined, { sensitivity: "base", numeric: true });
const ivN = n => Number(n).toLocaleString("en-US");
const ivSize = n => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;
const ivNum = v => typeof v === "number" ? v : typeof v === "string" && v.trim() !== "" ? Number(v) : NaN;
const ivStr = v => typeof v === "string" ? v.trim() : typeof v === "number" ? String(v) : "";
// canonicalItemType in script.lua
const ivType = v => { const s = ivStr(v).toLowerCase().replace(/[_\-\s]+/g, ""); return IV_TYPE_ALIAS[s] || s; };

const IV = {};
function resetItems() {
    Object.assign(IV, { loaded: false, busy: false, loadErr: "", info: null, list: null, listVersion: "", listBusy: false,
        listErr: "", pending: null, msg: null, q: "", type: "all", sort: "price", shown: IV_PAGE });
    for (const id of ["ivStats", "ivMsg", "ivCheck", "ivHist", "ivTypes", "ivTable", "ivFoot"]) $(id).innerHTML = "";
    $("ivQ").value = "";
    $("ivSort").value = "price";
    $("ivFile").value = "";
}
resetItems();

// ── reading a list ───────────────────────────────────────────────────────────
// The fields script.lua reads (normalizeItemEntry): type, name, price, pumping, fly/ride.
function ivEntry(e) {
    const p = isObj(e.properties) ? e.properties : {};
    const name = [e.name, e.baseName, p.baseName, p.name, p.realName, e.realName].map(ivStr).find(Boolean) || "";
    const real = ivStr(e.realName ?? p.realName);
    const price = Number.isFinite(ivNum(e.price)) ? ivNum(e.price) : ivNum(p.price);
    const avg = ivNum(e.avgPrice);
    const id = e.id ?? e.productId ?? e.product_id ?? p.id ?? p.productId ?? p.product_id;
    const fly = e.fly === true || e.flyable === true || p.fly === true || p.flyable === true;
    const ride = e.ride === true || e.rideable === true || p.ride === true || p.rideable === true;
    const form = e.pumping === "mega_neon" ? "mega" : e.pumping === "neon" ? "neon" : "normal";
    const age = ivStr(e.age ?? p.age);
    const type = ivType(e.type ?? e.category ?? p.type ?? p.category);
    return {
        // one item = one name in one form, fly/ride and age, whatever its listing id
        key: [type, (real || name).toLowerCase(), form, fly ? 1 : 0, ride ? 1 : 0, age].join("|"),
        name, real, type, form, fly, ride, age, rare: ivStr(e.rare ?? p.rare),
        price: Number.isFinite(price) && price >= 0 ? price : null,
        avg: Number.isFinite(avg) && avg >= 0 ? avg : null,
        img: typeof e.imageUri === "string" && /^https:\/\/[^\s"'<>\\]+$/.test(e.imageUri) ? e.imageUri : "",
        search: [name, real, ivStr(id), form === "normal" ? "" : form, fly ? "fly" : "", ride ? "ride" : "",
            age.replace(/_/g, " "), type].join(" ").toLowerCase(),
    };
}

// The whole file, the way the script will see it. { items, total, priced, warn } or { error }.
function ivRead(buf) {
    let text;
    try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }   // drops a BOM, like the script
    catch { return { error: "isn't a text file (it isn't UTF-8)" }; }
    let data;
    try { data = JSON.parse(text); } catch (err) { return { error: `isn't valid JSON (${err.message})` }; }
    if (!Array.isArray(data)) return { error: isObj(data) ? "is a JSON object, but items.json is a list: [ {…}, {…} ]" : "isn't a list of items" };
    if (!data.length) return { error: "is an empty list" };
    const items = [], seen = new Set();
    let notObj = 0, noName = 0, noType = 0, noPrice = 0, dup = 0;
    for (const e of data) {
        if (!isObj(e)) { notObj++; continue; }
        const it = ivEntry(e);
        if (!it.name) noName++;
        if (!it.type) noType++;
        if (it.price === null) noPrice++;
        if (seen.has(it.key)) dup++; else seen.add(it.key);
        items.push(it);
    }
    const good = items.filter(it => it.name && it.type && it.price !== null).length;
    if (good < data.length / 2) {
        return { error: `doesn't look like items.json: only ${ivN(good)} of its ${ivN(data.length)} entries have a name, a type and a price` };
    }
    const warn = [];
    if (notObj) warn.push(`${plural(notObj, "entry")} in the list ${notObj === 1 ? "isn't an item" : "aren't items"}; the scripts skip them`);
    if (noPrice) warn.push(`${plural(noPrice, "item")} ${noPrice === 1 ? "has" : "have"} no price, so the scripts can't value ${noPrice === 1 ? "it" : "them"}`);
    if (noName) warn.push(`${plural(noName, "item")} ${noName === 1 ? "has" : "have"} no name`);
    if (noType) warn.push(`${plural(noType, "item")} ${noType === 1 ? "has" : "have"} no type`);
    if (dup) warn.push(`${plural(dup, "item")} ${dup === 1 ? "is" : "are"} in the list twice (same name, form, fly/ride and age)`);
    return { items, total: data.length, priced: items.length - noPrice, warn };
}

async function ivSha(buf) {
    const h = new Uint8Array(await crypto.subtle.digest("SHA-256", buf));
    return Array.from(h, b => b.toString(16).padStart(2, "0")).join("");
}

function ivDiff(oldList, newList) {
    const index = list => { const m = new Map(); for (const it of list) if (!m.has(it.key)) m.set(it.key, it); return m; };
    const before = index(oldList), after = index(newList);
    const added = [], removed = [], changed = [];
    let up = 0;
    for (const [k, it] of after) {
        const was = before.get(k);
        if (!was) { added.push(it); continue; }
        if (was.price !== null && it.price !== null && Math.abs(it.price - was.price) >= 0.005) {
            changed.push({ it, was: was.price, now: it.price });
            if (it.price > was.price) up++;
        }
    }
    for (const [k, it] of before) if (!after.has(k)) removed.push(it);
    changed.sort((a, b) => Math.abs(b.now - b.was) - Math.abs(a.now - a.was));
    const byPrice = (a, b) => (b.price ?? -1) - (a.price ?? -1);
    added.sort(byPrice); removed.sort(byPrice);
    return { added, removed, changed, up, down: changed.length - up };
}

function ivTypeCounts(items) {
    const m = new Map();
    for (const it of items) m.set(it.type || "?", (m.get(it.type || "?") || 0) + 1);
    const rank = t => { const i = IV_TYPE_ORDER.indexOf(t); return i < 0 ? 99 : i; };
    return [...m].sort((a, b) => rank(a[0]) - rank(b[0]) || ivColl.compare(a[0], b[0]));
}

// ── talking to the Worker ────────────────────────────────────────────────────
async function ivFailure(res) {
    let body = null;
    try { body = await res.json(); } catch {}
    if (res.status === 401) return { kind: "wrong" };
    if (res.status === 429) return { kind: "locked", retryAfter: (body && body.retryAfter) || 900 };
    return { kind: "error", detail: (body && body.error) || `HTTP ${res.status}` };
}

// The bytes of one kept list.
async function ivFetchFile(version) {
    try {
        const res = await fetch(API + "/api/items/download", {
            method: "POST", headers: { "Content-Type": "application/json" }, cache: "no-store",
            body: JSON.stringify({ password, version }),
        });
        if (!res.ok) return ivFailure(res);
        return { kind: "ok", buf: await res.arrayBuffer(), version: res.headers.get("X-Items-Version") || version };
    } catch {
        return { kind: "offline" };
    }
}

const ivFailText = r => r.kind === "error" && r.detail === "not found"
    ? "the Worker doesn't have the item list routes yet; deploy the new worker.js" : failText(r);

async function loadItemInfo() {
    if (IV.busy) return;
    IV.busy = true; IV.loadErr = "";
    renderItems();
    const mine = session;
    const r = await post("/api/items/info");
    if (mine !== session) return;
    IV.busy = false;
    if (r.kind === "wrong") return lock("The password was changed. Enter the new one.");
    if (r.kind !== "ok") { IV.loadErr = ivFailText(r); return renderItems(); }
    IV.loaded = true;
    IV.info = r.body;
    renderItems();
    loadCurrentList();
}

// The list in use, for the price table and to compare a new file with.
async function loadCurrentList() {
    const cur = IV.info && IV.info.current;
    if (!cur || IV.listBusy || (IV.list && IV.listVersion === cur.version)) return;
    IV.listBusy = true; IV.listErr = "";
    renderIvTable();
    const mine = session;
    const r = await ivFetchFile(cur.version);
    if (mine !== session) return;
    IV.listBusy = false;
    if (r.kind === "wrong") return lock("The password was changed. Enter the new one.");
    if (r.kind !== "ok") IV.listErr = ivFailText(r);
    else {
        const read = ivRead(r.buf);
        if (read.error) IV.listErr = `the stored file ${read.error}`;
        else { IV.list = read.items; IV.listVersion = r.version; }
    }
    renderItems();
    loadCurrentList();          // the list in use changed while this one was on its way
}

// ── picking, checking and uploading a file ───────────────────────────────────
async function ivPick(files) {
    const file = files.find(f => /\.json$/i.test(f.name)) || files[0];
    if (!file || !IV.info || (IV.pending && IV.pending.state === "uploading")) return;
    if (!IV.info.kvBound) return renderIvMsg();
    const token = {}, mine = session;
    IV.pending = { token, name: file.name, size: file.size, state: "reading" };
    IV.msg = null;
    renderIvMsg(); renderIvCheck();
    const bad = error => { Object.assign(IV.pending, { state: "bad", error }); renderIvCheck(); };
    if (file.size > IV.info.maxBytes) return bad(`is ${ivSize(file.size)}; the Worker takes up to ${ivSize(IV.info.maxBytes)}`);
    if (!(window.crypto && crypto.subtle)) return bad("can't be checked here: open the dashboard over https");
    let buf, read, version;
    try {
        buf = await file.arrayBuffer();
        if (mine !== session || IV.pending?.token !== token) return;
        const hashing = ivSha(buf);
        read = ivRead(buf);
        version = await hashing;
    } catch (err) {
        if (mine !== session || IV.pending?.token !== token) return;
        return bad(`couldn't be read (${err && err.message || err})`);
    }
    if (mine !== session || IV.pending?.token !== token) return;
    if (read.error) return bad(read.error);
    Object.assign(IV.pending, { state: "ready", buf, version, read });
    renderIvCheck();
}

async function ivUpload() {
    const p = IV.pending, cur = IV.info && IV.info.current;
    if (!p || p.state !== "ready") return;
    if (cur && cur.count && p.read.items.length < cur.count / 2
        && !confirm(`This file has ${ivN(p.read.items.length)} items, less than half of the ${ivN(cur.count)} in the list in use. Upload it anyway?`)) return;
    p.state = "uploading";
    renderIvCheck();
    const mine = session;
    let res = null, body = null;
    try {
        res = await fetch(API + "/api/items/upload", {
            method: "POST", cache: "no-store", body: p.buf,
            headers: {
                "Content-Type": "application/json", "X-Password": encodeURIComponent(password), "X-Items-Version": p.version,
                "X-Items-Count": String(p.read.items.length), "X-Items-Name": encodeURIComponent(p.name),
            },
        });
        try { body = await res.json(); } catch {}
    } catch {}
    if (mine !== session || IV.pending !== p) return;
    if (res && res.ok && body && body.current) {
        IV.info = body;
        IV.list = p.read.items; IV.listVersion = p.version; IV.listErr = "";
        IV.pending = null; IV.shown = IV_PAGE;
        IV.msg = { kind: "ok", html: `Uploaded <b>${esc(p.name)}</b> (${ivN(p.read.items.length)} items). Every running script switches to it
            at its next settings check, within 5 minutes, and a script that starts or hops servers loads it straight away.` };
        return renderItems();
    }
    if (res && res.status === 401) return lock("The password was changed. Enter the new one.");
    p.state = "ready";
    renderIvCheck();
    ivSay("bad", !res ? `Couldn't reach the dashboard server, so nothing changed. If your connection is fine, try once more:
            on the free plan a big upload can now and then run past the Worker's time limit.`
        : `Upload failed: ${esc(res.status === 429 ? `locked out for ${waitWords((body && body.retryAfter) || 900)}`
            : (body && body.error) || `HTTP ${res.status}`)}`);
}

async function ivRestore(el) {
    const h = IV.info && IV.info.history.find(x => x.version === el.dataset.v);
    if (!h || !confirm(`Go back to ${h.name} from ${exact(h.uploadedAt)}? Every script switches to it within 5 minutes.`)) return;
    el.disabled = true;
    const mine = session;
    const r = await post("/api/items/restore", { version: h.version });
    if (mine !== session) return;
    if (r.kind === "wrong") return lock("The password was changed. Enter the new one.");
    if (r.kind !== "ok") { el.disabled = false; return ivSay("bad", `Couldn't switch to it: ${esc(ivFailText(r))}`); }
    IV.info = r.body; IV.shown = IV_PAGE;
    IV.msg = { kind: "ok", html: `Back to <b>${esc(h.name)}</b> from ${esc(exact(h.uploadedAt))}. Every script switches to it within 5 minutes.` };
    renderItems();
    loadCurrentList();
}

async function ivDownload(el) {
    const h = IV.info && IV.info.history.find(x => x.version === el.dataset.v);
    if (!h) return;
    el.disabled = true;
    const mine = session;
    const r = await ivFetchFile(h.version);
    if (mine !== session) return;
    el.disabled = false;
    if (r.kind === "wrong") return lock("The password was changed. Enter the new one.");
    if (r.kind !== "ok") return ivSay("bad", `Couldn't download it: ${esc(ivFailText(r))}`);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([r.buf], { type: "application/json" }));
    a.download = h.name || "items.json";
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60e3);
}

// ── rendering ────────────────────────────────────────────────────────────────
const ivBadges = it => (it.form === "mega" ? `<i class="b m" title="Mega neon">M</i>` : it.form === "neon" ? `<i class="b n" title="Neon">N</i>` : "")
    + (it.fly ? `<i class="b f" title="Fly">F</i>` : "") + (it.ride ? `<i class="b r" title="Ride">R</i>` : "");
const ivAge = it => it.age ? IV_AGE[it.age] || it.age.replace(/_/g, " ") : "";
const ivLabel = it => {
    const v = [it.form === "mega" ? "mega neon" : it.form === "neon" ? "neon" : "", it.fly ? "fly" : "", it.ride ? "ride" : "", ivAge(it).toLowerCase()].filter(Boolean);
    return (it.name || "?") + (v.length ? ` (${v.join(", ")})` : "");
};
const ivNameCell = it => `<div class="iv-nm">${esc(it.name || "?")}<span class="iv-var">${ivBadges(it)}${it.age ? `<span>${esc(ivAge(it))}</span>` : ""}</span></div>`;
const ivMoney = n => n === null ? `<span class="s-warn">no price</span>` : usd(n);

function ivSay(kind, html) { IV.msg = { kind, html }; renderIvMsg(); }

function renderItems() { renderIvStats(); renderIvMsg(); renderIvCheck(); renderIvHist(); renderIvTypes(); renderIvTable(); }

function renderIvStats() {
    const info = IV.info, c = info && info.current;
    const tile = (label, value, title) => `<div class="stat"${title ? ` title="${esc(title)}"` : ""}><span>${label}</span><b>${value}</b></div>`;
    $("ivStats").innerHTML = !info ? "" : !c ? tile("Item list", "None yet") : [
        tile("Items", c.count != null ? ivN(c.count) : IV.list && IV.listVersion === c.version ? ivN(IV.list.length) : "—"),
        tile("Uploaded", `<time data-t="${Number(c.uploadedAt)}">${esc(ago(Date.now() - c.uploadedAt))}</time>`, exact(c.uploadedAt)),
        tile("File", esc(ivSize(c.size)), c.name),
        tile("Version", `<span class="iv-mono">${esc(c.version.slice(0, 12))}</span>`, `${c.version}\n(SHA-256 of the file, the same as the item connector uses)`),
    ].join("");
    const usable = !!(info && info.kvBound);
    $("ivFile").disabled = !usable;
    $("ivDrop").classList.toggle("off", !usable);
}

function renderIvMsg() {
    const parts = [];
    if (IV.loadErr) {
        parts.push(`<div class="s-msg bad">Couldn't load the item list details: ${esc(IV.loadErr)}.
            <br><button class="btn small" type="button" data-iv="retry">Try again</button></div>`);
    } else if (!IV.info) {
        parts.push(`<div class="empty">Loading…</div>`);
    } else if (!IV.info.kvBound) {
        parts.push(`<div class="s-msg bad"><b>One-time setup:</b> the Worker has nowhere to keep the file yet. In Cloudflare go to
            <b>Storage &amp; Databases → KV → Create</b> and make a namespace (any name). Then open this Worker →
            <b>Settings → Bindings → Add → KV namespace</b>, set the variable name to <code>ITEMS</code>, pick that namespace and deploy.
            Reload this page afterwards.</div>`);
    } else if (!IV.info.current) {
        parts.push(`<div class="s-msg">No list uploaded yet. Until there is one, every script keeps using the item connector's
            list (or the items.json on its PC).</div>`);
    }
    if (IV.msg) parts.push(`<div class="s-msg ${IV.msg.kind === "info" ? "" : IV.msg.kind}">${IV.msg.html}</div>`);
    $("ivMsg").innerHTML = parts.join("");
}

function ivDiffHtml(d) {
    if (!d.added.length && !d.removed.length && !d.changed.length) {
        return `<p class="s-hint">Same items at the same prices as the list in use.</p>`;
    }
    const more = (n, shown) => n > shown ? `<p class="s-hint">…and ${ivN(n - shown)} more.</p>` : "";
    const names = (list, title) => !list.length ? "" : `<details><summary>${title} (${ivN(list.length)})</summary>
        <p class="s-hint">${list.slice(0, IV_NAMES_MAX).map(it => `${esc(ivLabel(it))} ${ivMoney(it.price)}`).join(" · ")}</p>
        ${more(list.length, IV_NAMES_MAX)}</details>`;
    const row = c => `<tr><td>${ivNameCell(c.it)}</td><td class="s-end">${usd(c.was)}</td><td class="s-end">${usd(c.now)}</td>
        <td class="s-end ${c.now > c.was ? "iv-up" : "iv-down"}">${c.now > c.was ? "+" : "−"}${usd(Math.abs(c.now - c.was))}${c.was > 0
            ? ` <small>${c.now > c.was ? "+" : "−"}${ivN(Math.round(Math.abs(c.now - c.was) / c.was * 100))}%</small>` : ""}</td></tr>`;
    const table = list => `<div class="s-scroll"><table class="s-tbl iv-small"><thead><tr><th>Item</th><th class="s-end">Now</th>
        <th class="s-end">New</th><th class="s-end">Change</th></tr></thead><tbody>${list.map(row).join("")}</tbody></table></div>`;
    return `<div class="iv-sum">
            <span>Price changes <b>${ivN(d.changed.length)}</b>${d.changed.length
                ? ` <em class="iv-up">▲ ${ivN(d.up)}</em> <em class="iv-down">▼ ${ivN(d.down)}</em>` : ""}</span>
            <span>New items <b>${ivN(d.added.length)}</b></span>
            <span>Gone <b>${ivN(d.removed.length)}</b></span>
        </div>
        ${d.changed.length ? `<h3 class="iv-h">Biggest price changes</h3>${table(d.changed.slice(0, IV_TOP))}` : ""}
        ${d.changed.length > IV_TOP ? `<details><summary>All price changes (${ivN(d.changed.length)})</summary>
            ${table(d.changed.slice(0, IV_NAMES_MAX))}${more(d.changed.length, IV_NAMES_MAX)}</details>` : ""}
        ${names(d.added, "New items")}
        ${names(d.removed, "Gone from the list")}`;
}

function renderIvCheck() {
    const p = IV.pending, el = $("ivCheck");
    if (!p) return void (el.innerHTML = "");
    const head = `<b>${esc(p.name)}</b> · ${esc(ivSize(p.size))}`;
    if (p.state === "reading") return void (el.innerHTML = `<div class="s-msg">${head} · checking…</div>`);
    if (p.state === "bad") {
        return void (el.innerHTML = `<div class="s-msg bad">${head}<br>This file ${esc(p.error)}. Nothing was uploaded.
            <br><button class="btn small" type="button" data-iv="cancel">OK</button></div>`);
    }
    const r = p.read, cur = IV.info && IV.info.current, same = !!cur && cur.version === p.version, busy = p.state === "uploading";
    let compare;
    if (same) compare = `<p class="s-hint">This is exactly the list the scripts use now, so there's nothing to upload.</p>`;
    else if (!cur) compare = `<p class="s-hint">The first list on the site, so there's nothing to compare it with.</p>`;
    else if (IV.listErr) compare = `<p class="s-hint s-warn">Can't compare it with the list in use: that one couldn't be loaded (${esc(IV.listErr)}).</p>`;
    else if (!IV.list || IV.listVersion !== cur.version) compare = `<p class="s-hint">Comparing with the list in use…</p>`;
    else {
        if (p.diffFor !== IV.listVersion) { p.diff = ivDiff(IV.list, r.items); p.diffFor = IV.listVersion; }
        compare = ivDiffHtml(p.diff);
    }
    const kept = !same && IV.info.history.some(h => h.version === p.version);
    el.innerHTML = `<div class="s-msg${r.warn.length ? "" : " ok"}">
        ${head} · ${ivN(r.items.length)} items, ${ivN(r.priced)} with a price
        <div class="iv-sum">${ivTypeCounts(r.items).map(([t, n]) => `<span>${esc(t)} <b>${ivN(n)}</b></span>`).join("")}</div>
        ${r.warn.length ? `<ul class="s-list s-warn">${r.warn.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
        ${kept ? `<p class="s-hint">This file is one of the earlier uploads below; uploading it makes it the list in use again.</p>` : ""}
        ${compare}
        <div class="iv-acts">
            ${same ? "" : `<button class="btn primary" type="button" data-iv="upload"${busy ? " disabled" : ""}>${busy ? "Uploading…" : "Upload and use it"}</button>`}
            <button class="btn" type="button" data-iv="cancel"${busy ? " disabled" : ""}>${same ? "Close" : "Cancel"}</button>
        </div></div>`;
}

function renderIvHist() {
    const info = IV.info;
    if (!info || !info.kvBound) return void ($("ivHist").innerHTML = "");
    const cur = info.current && info.current.version;
    const rows = info.history.map(h => `<tr>
        <td>${esc(exact(h.uploadedAt))}<div class="s-note s-hint"><time data-t="${Number(h.uploadedAt)}">${esc(ago(Date.now() - h.uploadedAt))}</time></div></td>
        <td class="iv-file">${esc(h.name)}</td>
        <td class="s-end">${h.count != null ? ivN(h.count) : "—"}</td>
        <td class="s-end">${esc(ivSize(h.size))}</td>
        <td><span class="iv-mono" title="${esc(h.version)}">${esc(h.version.slice(0, 12))}</span></td>
        <td class="s-end">${h.version === cur ? `<span class="s-pill">in use</span>`
            : `<button class="btn small" type="button" data-iv="restore" data-v="${esc(h.version)}">Use this one</button>`}
            <button class="btn small" type="button" data-iv="download" data-v="${esc(h.version)}">Download</button></td></tr>`).join("");
    $("ivHist").innerHTML = rows ? `<div class="s-scroll"><table class="s-tbl"><thead><tr><th>Uploaded</th><th>File</th><th class="s-end">Items</th>
        <th class="s-end">Size</th><th>Version</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<p class="nothing">Nothing uploaded yet.</p>`;
}

const ivReady = () => !!(IV.info && IV.info.current && IV.list && IV.listVersion === IV.info.current.version);

function renderIvTypes() {
    $("ivBar").hidden = !ivReady();
    if (!ivReady()) return void ($("ivTypes").innerHTML = "");
    const counts = ivTypeCounts(IV.list);
    if (IV.type !== "all" && !counts.some(([t]) => t === IV.type)) IV.type = "all";
    $("ivTypes").innerHTML = [["all", IV.list.length], ...counts].map(([t, n]) => `<button type="button" data-ivtype="${esc(t)}"
        class="${t === IV.type ? "on" : ""}">${esc(t === "all" ? "All" : t)} <span class="n">${ivN(n)}</span></button>`).join("");
}

function ivFiltered() {
    const words = IV.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const list = IV.list.filter(it => (IV.type === "all" || it.type === IV.type) && words.every(w => it.search.includes(w)));
    const dear = (a, b) => (b.price ?? -1) - (a.price ?? -1);
    const byName = (a, b) => ivColl.compare(a.name, b.name);
    if (IV.sort === "cheap") list.sort((a, b) => (a.price ?? Infinity) - (b.price ?? Infinity) || byName(a, b));
    else if (IV.sort === "name") list.sort((a, b) => byName(a, b) || dear(a, b));
    else list.sort((a, b) => dear(a, b) || byName(a, b));
    return list;
}

function renderIvTable() {
    const el = $("ivTable"), foot = $("ivFoot"), info = IV.info;
    foot.innerHTML = "";
    $("ivCount").hidden = !ivReady();
    if (!info) return void (el.innerHTML = "");
    if (!info.current) return void (el.innerHTML = `<p class="nothing">Once a list is uploaded, every item and its price shows up here.</p>`);
    if (IV.listErr) {
        return void (el.innerHTML = `<p class="nothing s-bad">Couldn't load the list: ${esc(IV.listErr)}.
            <button class="btn small" type="button" data-iv="retryList">Try again</button></p>`);
    }
    if (!ivReady()) return void (el.innerHTML = `<div class="empty">Loading the list…</div>`);
    $("ivCount").textContent = `${ivN(IV.list.length)} items`;
    const list = ivFiltered();
    if (!list.length) return void (el.innerHTML = `<p class="nothing">Nothing matches.</p>`);
    const shown = list.slice(0, IV.shown);
    el.innerHTML = `<div class="s-scroll"><table class="s-tbl iv-tbl"><thead><tr><th></th><th>Item</th><th>Type</th><th>Rarity</th>
        <th class="s-end">Price</th><th class="s-end" title="avgPrice in items.json">Avg price</th></tr></thead><tbody>${shown.map(it => `<tr>
        <td class="iv-pic">${it.img ? `<img class="iv-thumb ${it.form}" loading="lazy" decoding="async" alt="" src="${esc(it.img)}">`
            : `<span class="iv-thumb ${it.form}"></span>`}</td>
        <td>${ivNameCell(it)}</td>
        <td class="iv-cap">${esc(it.type || "—")}</td>
        <td class="iv-cap">${esc(it.rare.replace(/_/g, " ") || "—")}</td>
        <td class="s-end iv-price">${ivMoney(it.price)}</td>
        <td class="s-end iv-dim">${it.avg === null ? "—" : usd(it.avg)}</td></tr>`).join("")}</tbody></table></div>`;
    const left = list.length - shown.length;
    foot.innerHTML = `<span>Showing ${ivN(shown.length)} of ${ivN(list.length)}</span>${left
        ? `<button class="iv-more" type="button" data-iv="more">Show ${ivN(Math.min(IV_PAGE, left))} more</button>` : ""}`;
}

// Called by showView when the tab opens.
function openItems() {
    if (!IV.loaded) return loadItemInfo();
    renderItems();
    loadCurrentList();
}

// ── wiring ───────────────────────────────────────────────────────────────────
$("itemsView").addEventListener("click", e => {
    const t = e.target.closest("[data-ivtype]");
    if (t) { IV.type = t.dataset.ivtype; IV.shown = IV_PAGE; renderIvTypes(); return renderIvTable(); }
    const b = e.target.closest("[data-iv]");
    if (!b || b.disabled) return;
    const acts = {
        upload: ivUpload,
        cancel: () => { IV.pending = null; renderIvCheck(); },
        restore: () => ivRestore(b),
        download: () => ivDownload(b),
        more: () => { IV.shown += IV_PAGE; renderIvTable(); },
        retry: loadItemInfo,
        retryList: () => { IV.listErr = ""; loadCurrentList(); },
    };
    if (acts[b.dataset.iv]) acts[b.dataset.iv]();
});
$("ivFile").addEventListener("change", e => {
    const files = [...e.target.files];
    e.target.value = "";            // the same file can be picked again
    if (files.length) ivPick(files);
});
$("ivQ").addEventListener("input", e => { IV.q = e.target.value; IV.shown = IV_PAGE; renderIvTable(); });
$("ivSort").addEventListener("change", e => { IV.sort = e.target.value; IV.shown = IV_PAGE; renderIvTable(); });

// A file dropped anywhere on this page is taken, so a near miss doesn't open the
// file in the tab (and lose the password).
const ivDropping = e => !!password && !$("itemsView").hidden && $("modal").hidden
    && !!e.dataTransfer && [...e.dataTransfer.types].includes("Files");
document.addEventListener("dragover", e => {
    if (!ivDropping(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = IV.info && IV.info.kvBound ? "copy" : "none";
    $("ivDrop").classList.add("over");
});
document.addEventListener("dragleave", e => { if (!e.relatedTarget) $("ivDrop").classList.remove("over"); });
document.addEventListener("drop", e => {
    $("ivDrop").classList.remove("over");
    if (!ivDropping(e)) return;
    e.preventDefault();
    ivPick([...e.dataTransfer.files]);
});

// A picture that doesn't load leaves an empty square.
$("itemsView").addEventListener("error", e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement) || !img.classList.contains("iv-thumb")) return;
    const s = document.createElement("span");
    s.className = img.className;
    img.replaceWith(s);
}, true);
</script>

<script>
// ── Restocking ───────────────────────────────────────────────────────────────
// Drawn from POST /api/restock/state: what restocking_site.lua reports (receivers check in,
// every slot reports its stage, finished restocks report how they ended) plus the house
// files pasted on the Houses page. Polled while the tab is open.

const RS_STEPS = [["buy", "Buy", "Buy a new house"], ["clear", "Clear", "Clear the default furniture"], ["textures", "Walls", "Apply wall and floor textures"],
    ["furniture", "Items", "Place the furniture"], ["list", "List", "List the house for trade"], ["trade", "Trade", "Trade it to the receiver"]];
const RS_POLL_MS = 8000;
const RS_EMPTY = { houseFiles: [], receivers: [], ids: {}, slots: [], waitingReceivers: [], waitingSenders: [], stocked: [], traded: [], partial: [], failed: [] };
const RS = { page: "main", data: null, busy: false, at: 0, err: "", saved: null, key: "" };
const rsD = () => RS.data || RS_EMPTY;

function resetRestock() {
    Object.assign(RS, { data: null, busy: false, at: 0, err: "", saved: null, key: "" });
    for (const id of ["rsStats", "rsAccts", "rsFail", "rsHList", "rsHInfo"]) $(id).innerHTML = "";
    $("rsHList").rsHtml = "";
    $("rsHText").value = $("rsHName").value = "";
}

// The Worker's answer, with every time moved onto this device's clock.
function rsLoad(body) {
    const skew = Date.now() - (Number(body.now) || Date.now());
    const t = v => (Number(v) ? Number(v) + skew : 0);
    const list = v => (Array.isArray(v) ? v : []);
    RS.data = {
        houseFiles: list(body.houseFiles).map(h => ({ ...h, added: t(h.added), top: list(h.top) })),
        receivers: list(body.receivers).map(r => ({ ...r, firstSeen: t(r.firstSeen), seenAt: t(r.seenAt) })),
        ids: isObj(body.ids) ? body.ids : {},
        slots: list(body.slots).map(x => ({ ...x, startTime: t(x.startTime) })),
        waitingReceivers: list(body.waitingReceivers).map(x => ({ ...x, since: t(x.since) })),
        waitingSenders: list(body.waitingSenders).map(x => ({ ...x, canBuild: list(x.canBuild), since: t(x.since) })),
        stocked: list(body.stocked).map(x => ({ ...x, finish: t(x.finish) })),
        traded: list(body.traded).map(x => ({ ...x, start: t(x.start), finish: t(x.finish) })),
        partial: list(body.partial).map(x => ({ ...x, finish: t(x.finish) })),
        failed: list(body.failed).map(x => ({ ...x, finish: t(x.finish) })),
    };
    RS.at = Date.now();
    RS.err = "";
}

// A page-side call came back: the new state, or why not (the password check locks the page).
function rsAnswer(r, mine) {
    if (mine !== session) return false;
    if (r.kind === "wrong") { lock("The password was changed. Enter the new one."); return false; }
    if (r.kind !== "ok") { RS.err = failText(r); rsSync(); return false; }
    rsLoad(r.body);
    return true;
}

async function rsFetch() {
    if (RS.busy || !password) return;
    RS.busy = true;
    const mine = session;
    const r = await post("/api/restock/state");
    if (mine !== session) return;
    RS.busy = false;
    // a failed poll still redraws, so the empty lists say why
    if (rsAnswer(r, mine) || (password && mine === session)) renderRestock();
}

// Opening the tab: draw what we have, then catch up.
function openRestock() {
    renderRestock(true);
    rsFetch();
}
setInterval(() => { if (password && !document.hidden && !$("rsView").hidden) rsFetch(); }, RS_POLL_MS);

// The pill next to the page buttons: when the data is from, or why it isn't fresh.
function rsSync() {
    const el = $("rsSync");
    el.classList.toggle("warn", !!RS.err || !RS.at);
    el.textContent = RS.err ? (RS.at ? `Couldn't refresh · showing ${clock(RS.at)}` : "Couldn't load") : RS.at ? `Live · ${clock(RS.at)}` : "Loading…";
    el.title = RS.err ? `${RS.err[0].toUpperCase()}${RS.err.slice(1)}.` : "Refreshes every few seconds while this page is open.";
}

const rsN = n => Number(n).toLocaleString("en-US");
const rsS = n => n === 1 ? "" : "s";
const BUCKS_ICON = "https://static.wikia.nocookie.net/adoptme/images/1/1e/Bucks.png/revision/latest/scale-to-width-down/20?cb=20211117081630";
const rsBucks = n => `<span class="bucks" title="${rsN(n)} bucks"><img src="${BUCKS_ICON}" alt="" width="20" height="20" referrerpolicy="no-referrer">${rsN(n)}</span>`;
function rsDur(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
    return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m ${String(sec).padStart(2, "0")}s`;
}
const rsAcct = name => rsD().receivers.find(r => r.name === name);
// Roblox user id for a headshot: the receiver's own report, a sender's, or an inventory account of the same name.
const rsId = name => rsAcct(name)?.userId || rsD().ids[name] || ACCOUNTS.find(a => a.username === name)?.userId || 0;
// Same headshot the inventory uses; the page-wide error handler swaps in the letter if it won't load.
function rsAv(name, cls = "rs-av") {
    const id = rsId(name), letter = esc((name[0] || "?").toUpperCase());
    return id ? `<img class="avatar ${cls}" src="${esc(HEADSHOT(id))}" alt="" data-initial="${letter}">`
              : `<div class="avatar ${cls} fallback">${letter}</div>`;
}
const rsNone = text => `<div class="rs-none">${text}</div>`;
const rsPair = (s, r) => `${s ? esc(s) : '<span class="iv-dim">-</span>'} <span class="iv-dim">→</span> ${r ? esc(r) : '<span class="iv-dim">-</span>'}`;
const rsNum = id => id ? `#${id}` : "";

// ── receiver setup ───────────────────────────────────────────────────────────
// Where a receiver is right now, worked out from the restock lists: [class, label, detail].
function rsState(r) {
    const D = rsD();
    const slot = D.slots.find(s => s.receiver === r.name);
    if (slot) {
        const verb = RS_VERB[slot.stage] || "Trading", of = Math.max(1, slot.target - slot.start);
        return ["run", `${verb}…`, `house ${Math.max(1, Math.min(slot.final - slot.start + 1, of))} of ${of}${slot.id ? ` · #${slot.id}` : ""}`];
    }
    if (!r.house || !r.want) return ["setup", "Needs setup", `<span data-rs-since="${r.firstSeen}">${rsDur(Date.now() - r.firstSeen)}</span>`];
    if (!rsHasFile(r.house)) return ["nofile", "Not restocking", "no house file"];
    const w = D.waitingReceivers.find(x => x.name === r.name);
    if (w) return ["queue", "Waiting for sender", rsNum(w.id)];
    if (r.owns >= r.want) return ["full", "Stocked", ""];
    return ["idle", "Not running", ago(Date.now() - r.seenAt)];
}
const RS_ORDER = { setup: 0, nofile: 1, run: 2, queue: 3, idle: 4, full: 5 };
// What the status bar says while a sender works through RS_STEPS.
const RS_VERB = { buy: "Buying the house", clear: "Clearing it", textures: "Painting walls", furniture: "Placing items", list: "Listing it", trade: "Trading" };
const rsStateHtml = r => { const [cls, label, sub] = rsState(r); return `<div class="rs-st ${cls}">${label}${sub ? `<small>· ${sub}</small>` : ""}</div>`; };
const rsHasFile = name => !!rsHouse(name);

// The top of a receiver card: sender | receiver. d is what's in the boxes under it
// (not saved yet maybe), so "clones N" follows the typing.
function rsTop(r, d) {
    const slot = rsD().slots.find(s => s.receiver === r.name), st = rsStocked(r.name);
    let sender;
    if (slot) {
        sender = `${rsAv(slot.sender, "rs-big")}<b>${esc(slot.sender)}</b><small>${rsBucks(slot.bucks)}</small>`;
    } else if (st && r.owns >= r.want) {
        sender = `${rsAv(st.sender, "rs-big")}<b>${esc(st.sender)}</b><small>${rsBucks(st.bucks)} left</small>`;
    } else {
        const n = (d.want || 0) - r.owns, cost = rsHouse(d.house)?.cost;
        const line = !d.house || !d.want ? "pick a house and how many below"
            : !rsHasFile(d.house) ? "there's no file for that house"
            : n > 0 ? `next free sender clones <strong>${n}</strong> × ${esc(d.house)}${cost ? `<br>about ${rsBucks(cost * n)}` : ""}`
            : "nothing to clone, it owns enough";
        sender = `<div class="avatar rs-big fallback nobody">?</div><b class="iv-dim">No sender yet</b><small>${line}</small>`;
    }
    // the bar: houses the receiver owns out of what it should own (live while trading)
    const [cls] = rsState(r), want = slot ? slot.target : d.want || r.want || 0, owns = slot ? slot.final : r.owns;
    const pct = want ? Math.min(100, owns / want * 100) : 0;
    return `<div class="rs-bar">${rsStateHtml(r)}<div class="rs-prog ${cls}" title="${owns} of ${want || "?"} houses"><i style="width:${pct}%"></i></div></div>
        <div class="rs-pc"><div class="rs-side s"><span>Sender</span>${sender}</div><i></i>
        <div class="rs-side r"><span>Receiver</span>${rsAv(r.name, "rs-big")}<b>${esc(r.name)}</b>
            <small>owns <strong>${r.owns}</strong> houses · seen ${ago(Date.now() - r.seenAt)}</small></div></div>`;
}

}

const rsField = (el, f) => el.querySelector(`[data-f="${f}"]`);
const rsDraft = el => ({ house: rsField(el, "house").value, want: Number(rsField(el, "want").value) || 0 });

function rsPatchAccts() {

}
const rsDirty = (row, r) => rsField(row, "house").value !== (r.house || "")
    || rsField(row, "want").value.trim() !== (r.want == null ? "" : String(r.want));
// Someone is typing in a card: a poll mustn't rebuild them.
const rsEditing = () => [...document.querySelectorAll("#rsAccts [data-rs-acct]")].some(row => {

});

async function rsSave(row) {
    const r = rsAcct(row.dataset.rsAcct), btn = row.querySelector("[data-rs-save]");
    if (!r || row.rsBusy || !rsDirty(row, r)) return;
    const house = rsField(row, "house").value, raw = rsField(row, "want").value.trim(), want = Number(raw);
    // a bad box just goes red, no message
    const badHouse = !house, badWant = !/^\d+$/.test(raw) || want < 1 || want > 999;
    rsField(row, "house").classList.toggle("bad", badHouse);
    rsField(row, "want").closest(".in").classList.toggle("bad", badWant);
    if (badHouse || badWant) return;
    btn.disabled = row.rsBusy = true;
    btn.textContent = "Saving…";
    const mine = session;
    const res = await post("/api/restock/setup", { name: r.name, house, want });
    row.rsBusy = false;
    if (!rsAnswer(res, mine)) {
        if (mine !== session || !btn.isConnected) return;
        btn.disabled = false;
        btn.textContent = "Save";
        btn.title = RS.err;
        return;
    }
    RS.saved = r.name;
    renderRestock(true);
}

// Asks once (label), a second click within 3 s goes ahead: true then.
function rsArm(btn, label) {
    if (btn.classList.contains("armed")) return true;
    const was = btn.textContent;
    btn.classList.add("armed");
    btn.textContent = label;
    clearTimeout(btn.rsT);
    btn.rsT = setTimeout(() => { btn.classList.remove("armed"); btn.textContent = was; }, 3000);
    return false;
}

// ── finished restocks ────────────────────────────────────────────────────────
// A sender stays with the receiver it filled until that receiver is removed here, then
// its script moves on to the next receiver it can pay for.
const rsStocked = name => rsD().stocked.find(x => x.receiver === name);
// Remove (asks once): the receiver leaves the list, its script stops, its sender moves on.
async function rsRemove(row, btn) {
    if (!rsArm(btn, "Sure?")) return;
    clearTimeout(btn.rsT);
    btn.disabled = true;
    btn.textContent = "Removing…";
    const mine = session;
    if (rsAnswer(await post("/api/restock/remove", { name: row.dataset.rsAcct }), mine)) return renderRestock(true);
    if (mine !== session || !btn.isConnected) return;
